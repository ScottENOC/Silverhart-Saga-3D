<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171b19">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171b19; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 42%, #344239 0%, #202923 48%, #141916 100%);
      color: #f1eadb; transition: opacity .35s ease; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .panel { width: min(420px, 100%); text-align: center; }
    .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #c6b58f; }
    h1 { margin: 14px 0 8px; font-family: Georgia, serif; font-size: clamp(30px, 8vw, 44px); font-weight: 500; }
    #status { min-height: 24px; margin: 18px 0 12px; color: #e0d8c8; font-size: 14px; }
    .track { height: 5px; overflow: hidden; border-radius: 9px; background: #596157; }
    #bar { width: 0%; height: 100%; border-radius: inherit; background: #d2bd88; transition: width .15s ease; }
    #percent { margin-top: 9px; min-height: 18px; color: #c6bda9; font-size: 12px; font-variant-numeric: tabular-nums; }
    #error { display: none; margin-top: 20px; padding: 14px; border: 1px solid #a96b5f; border-radius: 8px; color: #ffd6ca; text-align: left; font-size: 13px; line-height: 1.5; }
    #retry { display: none; margin-top: 12px; padding: 10px 18px; border: 1px solid #c6b58f; border-radius: 6px; background: transparent; color: #f1eadb; font: inherit; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div class="panel">
      <div class="eyebrow">Silverhart Saga</div>
      <h1>Hollowmere</h1>
      <div id="status">Preparing the game engine…</div>
      <div class="track"><div id="bar"></div></div>
      <div id="percent">Waiting for download information</div>
      <div id="error" role="alert"></div>
      <button id="retry" onclick="location.reload()">Try again</button>
    </div>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const statusNode = document.getElementById("status");
    const bar = document.getElementById("bar");
    const percent = document.getElementById("percent");
    const errorNode = document.getElementById("error");
    const retry = document.getElementById("retry");
    const loading = document.getElementById("loading");
    let lastProgress = 0;

    function showError(error) {
      statusNode.textContent = "The game could not finish loading.";
      percent.textContent = "Loading stopped";
      errorNode.style.display = "block";
      errorNode.textContent = String(error && error.message ? error.message : error);
      retry.style.display = "inline-block";
      console.error("Silverhart startup failed:", error);
    }

    try {
      statusNode.textContent = "Downloading game engine and world data…";
      const engine = new Engine($GODOT_CONFIG);
      engine.startGame({
        canvas: document.getElementById("canvas"),
        onProgress: (current, total) => {
          statusNode.textContent = total > 0
            ? "Downloading game files…"
            : "Downloading game files (size not yet available)…";
          if (total > 0) {
            const ratio = Math.max(0, Math.min(1, current / total));
            lastProgress = ratio;
            bar.style.width = (ratio * 100).toFixed(1) + "%";
            percent.textContent = (ratio * 100).toFixed(0) + "% · " +
              (current / 1048576).toFixed(1) + " / " + (total / 1048576).toFixed(1) + " MB";
          } else {
            percent.textContent = "Downloaded " + (current / 1048576).toFixed(1) + " MB";
          }
        },
        onPrint: (...args) => {
          const line = args.join(" ");
          if (/hollowmere|village|character|ara|npc/i.test(line)) {
            statusNode.textContent = "Preparing " + (line.length > 90 ? line.slice(0, 87) + "…" : line);
          }
          console.log(...args);
        },
        onPrintError: (...args) => console.error(...args)
      }).then(() => {
        statusNode.textContent = "Entering Hollowmere…";
        bar.style.width = "100%";
        percent.textContent = "Ready";
        window.setTimeout(() => loading.classList.add("hidden"), 250);
      }).catch(showError);
    } catch (error) {
      showError(error);
    }
  </script>
</body>
</html>
