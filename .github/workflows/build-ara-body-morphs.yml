name: Build Ara body morph GLB

on:
  push:
    branches: [dev_2]
    paths:
      - "tools/makehuman/compare_glb_topology.py"
      - "tools/blender/build_ara_body_morphs.py"
      - "tools/blender/add_adult_anatomy.py"
      - ".github/workflows/build-ara-body-morphs.yml"
      - "character-preview/wren-ara.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ara-body-morph-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri

      - name: Prepare low, neutral and high Ara body profiles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("character-preview/wren-ara.json").read_text())
          for name, muscle in (("low", 0.20), ("neutral", 0.50), ("high", 0.80)):
              profile = json.loads(json.dumps(source))
              params = profile["params"]
              params.update({
                  "name": f"AraMuscle_{name}",
                  "seed": 1,
                  "gender": 0,
                  "muscle": muscle,
                  "weight": 0.5,
                  "height": 0.5,
                  "proportions": 0.5,
                  "breastSize": 0.5,
                  "breastFirmness": 0.5,
                  "hair": "none",
                  "eyebrows": "none",
                  "eyelashes": "none",
                  "outfit": "none",
                  "top": "none",
                  "jacket": "none",
                  "bottom": "none",
                  "underwear": False,
                  "shoes": "none",
                  "hat": "none",
                  "accessories": [],
                  "tattoos": [],
                  "earrings": "none",
                  "rig": "game",
                  "faceBones": False,
                  "animations": False,
                  "faceShapes": False,
                  "speechShapes": False,
                  "teeth": "none",
                  "tongue": False,
              })
              folder = Path(f"build/ara-morph/{name}")
              folder.mkdir(parents=True, exist_ok=True)
              (folder / "profile.json").write_text(json.dumps(profile, indent=2) + "\n")
          PY

      - name: Export the three matching Ara body states
        run: |
          set -euo pipefail
          for state in low neutral high; do
            npx --yes ara3d@latest export \
              --params "build/ara-morph/$state/profile.json" \
              --detail medium --no-animations --out "build/ara-morph/$state/export"
            glb="$(find "build/ara-morph/$state/export" -maxdepth 1 -type f -name '*.glb' | head -n 1)"
            test -s "$glb"
            echo "$glb" > "build/ara-morph/$state/source-path.txt"
          done

      - name: Apply the same integrated anatomy pass to all three states
        run: |
          set -euo pipefail
          for state in low neutral high; do
            input="$(cat "build/ara-morph/$state/source-path.txt")"
            blender --background --python-exit-code 1 \
              --python tools/blender/add_adult_anatomy.py -- \
              --input "$input" \
              --output "build/ara-morph/$state/anatomy.glb" \
              --profile female --adult --method integrated --deformation-scale 1.65 --preserve-topology --no-canal --no-anus
            test -s "build/ara-morph/$state/anatomy.glb"
          done

      - name: Build verified relative Ara muscle shape keys
        run: |
          set -euo pipefail
          blender --background --python-exit-code 1 \
            --python tools/blender/build_ara_body_morphs.py -- \
            --base build/ara-morph/neutral/anatomy.glb \
            --low build/ara-morph/low/anatomy.glb \
            --high build/ara-morph/high/anatomy.glb \
            --output build/ara-morph/ara_person_body_anatomy_morphs.glb \
            --report build/ara-morph/morph-build-report.json
          test -s build/ara-morph/ara_person_body_anatomy_morphs.glb
          test -s build/ara-morph/morph-build-report.json

      - name: Upload candidate GLB and build report
        uses: actions/upload-artifact@v4
        with:
          name: ara-body-morph-glb-${{ github.run_number }}
          path: |
            build/ara-morph/ara_person_body_anatomy_morphs.glb
            build/ara-morph/morph-build-report.json
          if-no-files-found: error
          retention-days: 30
