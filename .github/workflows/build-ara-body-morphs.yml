name: Build Ara body morph prototypes

on:
  push:
    branches: [dev_2]
    paths:
      - "tools/blender/add_body_morphs.py"
      - ".github/workflows/build-ara-body-morphs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ara-body-morph-prototypes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_2

      - name: Validate morph builder syntax
        run: python -m py_compile tools/blender/add_body_morphs.py

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri

      - name: Build non-destructive female and male prototypes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ara-body-morph-prototypes
          blender --background --python-exit-code 1 \
            --python tools/blender/add_body_morphs.py -- \
            --input art/characters/ara_runtime/ara_person_body_anatomy.glb \
            --output build/ara-body-morph-prototypes/ara_person_body_anatomy_prototype.glb
          blender --background --python-exit-code 1 \
            --python tools/blender/add_body_morphs.py -- \
            --input art/characters/ara_runtime/ara_person_male_body.glb \
            --output build/ara-body-morph-prototypes/ara_person_male_body_prototype.glb
          test -s build/ara-body-morph-prototypes/ara_person_body_anatomy_prototype.glb
          test -s build/ara-body-morph-prototypes/ara_person_male_body_prototype.glb

      - name: Validate prototypes in Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project and generated prototypes
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit
          test -s build/ara-body-morph-prototypes/ara_person_body_anatomy_prototype.glb.import
          test -s build/ara-body-morph-prototypes/ara_person_male_body_prototype.glb.import

      - name: Upload prototype GLBs
        uses: actions/upload-artifact@v4
        with:
          name: ara-body-morph-prototypes-${{ github.run_number }}
          path: build/ara-body-morph-prototypes/
          if-no-files-found: error
          retention-days: 30
