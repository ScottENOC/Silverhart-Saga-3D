name: Probe Ara body morph topology

on:
  push:
    branches: [dev_2]
    paths:
      - "tools/makehuman/compare_glb_topology.py"
      - ".github/workflows/build-ara-body-morphs.yml"
      - "character-preview/wren-ara.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ara-body-morph-topology
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare bare-body profiles with different muscle values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("character-preview/wren-ara.json").read_text())
          for name, muscle in (("base", 0.20), ("muscle", 0.80)):
              profile = json.loads(json.dumps(source))
              params = profile["params"]
              params.update({
                  "name": f"MorphProbe_{name}",
                  "seed": 1,
                  "gender": 0,
                  "muscle": muscle,
                  "weight": 0.5,
                  "height": 0.5,
                  "proportions": 0.5,
                  "breastSize": 0.5,
                  "breastFirmness": 0.5,
                  "hair": "none",
                  "eyebrows": "none",
                  "eyelashes": "none",
                  "outfit": "none",
                  "top": "none",
                  "jacket": "none",
                  "bottom": "none",
                  "underwear": False,
                  "shoes": "none",
                  "hat": "none",
                  "accessories": [],
                  "tattoos": [],
                  "earrings": "none",
                  "rig": "none",
                  "faceBones": False,
                  "animations": False,
                  "faceShapes": False,
                  "speechShapes": False,
                  "teeth": "none",
                  "tongue": False,
              })
              Path(f"build/morph-probe/{name}.json").parent.mkdir(parents=True, exist_ok=True)
              Path(f"build/morph-probe/{name}.json").write_text(json.dumps(profile, indent=2) + "\\n")
          PY

      - name: Export bare base and muscle-variant bodies at medium detail
        run: |
          set -euo pipefail
          npx --yes ara3d@latest export --params build/morph-probe/base.json --detail medium --no-animations --out build/morph-probe/base
          npx --yes ara3d@latest export --params build/morph-probe/muscle.json --detail medium --no-animations --out build/morph-probe/muscle
          base="$(find build/morph-probe/base -maxdepth 1 -type f -name '*.glb' | head -n 1)"
          muscle="$(find build/morph-probe/muscle -maxdepth 1 -type f -name '*.glb' | head -n 1)"
          test -s "$base"
          test -s "$muscle"
          echo "$base" > build/morph-probe/base-path.txt
          echo "$muscle" > build/morph-probe/muscle-path.txt

      - name: Compare vertex and index topology
        run: |
          set -euo pipefail
          base="$(cat build/morph-probe/base-path.txt)"
          muscle="$(cat build/morph-probe/muscle-path.txt)"
          python tools/makehuman/compare_glb_topology.py \\
            --base "$base" \\
            --variant "$muscle" \\
            --output build/morph-probe/topology-report.json

      - name: Upload topology probe
        uses: actions/upload-artifact@v4
        with:
          name: ara-body-morph-topology-${{ github.run_number }}
          path: build/morph-probe/
          if-no-files-found: error
          retention-days: 30
