name: Build Hollowmere Ara characters

on:
  workflow_dispatch:
  push:
    branches: [dev, feature/opening-village, feature/character-runtime-asset-integration, feature/unified-female-anatomy-v2]
    paths:
      - "data/characters/hollowmere_npcs.json"
      - "tools/ara/build_hollowmere_npcs.py"
      - "tools/ara/patch_layering.py"
      - "tools/ara/integrate_hollowmere_anatomy.py"
      - "tools/blender/add_adult_anatomy.py"
      - "tools/blender/add_male_anatomy.py"
      - ".github/workflows/hollowmere-npcs.yml"

permissions:
  contents: write

concurrency:
  group: hollowmere-npcs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate the Hollowmere cast with Ara
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install and pin Ara 3D Gen
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/olatunde85/3d-gen.git /tmp/ara-3d-gen
          git -C /tmp/ara-3d-gen checkout b60b5bece6d383d2cbb7067fd50e7c8e68b5a395
          cd /tmp/ara-3d-gen
          corepack enable
          pnpm install --no-frozen-lockfile
          npm run setup-assets

      - name: Apply Silverhart garment-layer contract
        run: |
          set -euo pipefail
          cd /tmp/ara-3d-gen
          python "$GITHUB_WORKSPACE/tools/ara/patch_layering.py"

      - name: Validate and generate all village characters
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ara-3d-gen
          python -m py_compile "$GITHUB_WORKSPACE/tools/ara/build_hollowmere_npcs.py"
          python "$GITHUB_WORKSPACE/tools/ara/build_hollowmere_npcs.py" --out "$GITHUB_WORKSPACE/art/characters/hollowmere"

      - name: Install Blender for gendered adult anatomy integration
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri

      - name: Integrate v2 female and dedicated male anatomy into every adult NPC model
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/ara/integrate_hollowmere_anatomy.py
          python tools/ara/integrate_hollowmere_anatomy.py --directory art/characters/hollowmere

      - name: Upload generated Ara GLBs and parameter files
        uses: actions/upload-artifact@v7
        with:
          name: hollowmere-npc-models
          path: |
            art/characters/hollowmere/*.glb
            art/characters/hollowmere/*.params.json
            art/characters/hollowmere/profiles.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit regenerated Hollowmere models to the integration branch
        if: github.event_name == 'push' && (github.ref_name == 'feature/character-runtime-asset-integration' || github.ref_name == 'dev')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/characters/hollowmere/
          if git diff --cached --quiet; then
            echo "Hollowmere models already match the generated anatomy pipeline."
            exit 0
          fi
          git commit -m "Regenerate Hollowmere NPC models with current gendered anatomy"
          git fetch origin
          # Reapply the generated-model commit on top of the latest branch tip.
          # A plain rebase can silently leave HEAD behind when the trigger SHA
          # is an ancestor of a branch that advanced during the long build.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push regenerated Hollowmere models after three retries."
              exit 1
            fi
          done
