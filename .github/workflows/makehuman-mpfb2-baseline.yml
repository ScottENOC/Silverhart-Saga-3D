name: MakeHuman MPFB2 garment baseline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/makehuman-mpfb2-baseline.yml"
      - "tools/makehuman/**"
  push:
    branches:
      - integration/makehuman-mpfb2-baseline-20261125
    paths:
      - ".github/workflows/makehuman-mpfb2-baseline.yml"
      - "tools/makehuman/**"

permissions:
  contents: read

jobs:
  mpfb2-garment-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender 4.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --version

      - name: Download upstream MPFB2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/makehumancommunity/mpfb2.git "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD | tee mpfb2-source-commit.txt
          # MPFB2 is a Blender 4.2 extension. Install it in an extension
          # repository so __package__ is bl_ext.user_default.mpfb and
          # bpy.utils.extension_path_user() receives a valid extension ID.
          mkdir -p "$HOME/.config/blender/4.2/extensions/user_default"
          cp -R "$RUNNER_TEMP/mpfb2/src/mpfb" "$HOME/.config/blender/4.2/extensions/user_default/mpfb"
          test -f "$HOME/.config/blender/4.2/extensions/user_default/mpfb/blender_manifest.toml"

      - name: Download original MakeHuman system assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/blender/4.2/extensions/user_default/mpfb/data"
          curl -L --retry 3 -o "$RUNNER_TEMP/makehuman_system_assets_cc0.zip" \
            https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip
          python3 - "$RUNNER_TEMP/makehuman_system_assets_cc0.zip" "$HOME/.config/blender/4.2/extensions/user_default/mpfb/data" <<'PY'
          import sys, zipfile
          archive, destination = sys.argv[1:]
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(destination)
          PY
          find "$HOME/.config/blender/4.2/extensions/user_default/mpfb/data" -name '*.mhclo' -print -o -name '*.mhmat' -print | sed -n '1,30p'

      - name: Run the upstream garment fitting smoke test
        run: |
          blender -b --factory-startup --python tools/makehuman/mpfb2_garment_smoke.py

      - name: Upload baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makehuman-mpfb2-baseline
          path: |
            makehuman-baseline/
            mpfb2-source-commit.txt
          if-no-files-found: warn
