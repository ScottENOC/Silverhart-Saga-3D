name: Build Wren Workshop
# The exact cleanup commit message routes this run to the one-off history-squash job.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "tools/blender/**"
      - "site/**"
      - ".github/workflows/wren-workshop.yml"
permissions:
  contents: read
  id-token: write
concurrency:
  group: wren-workshop
  cancel-in-progress: false
jobs:
  build-and-publish:
    if: ${{ github.event_name != 'push' || github.event.head_commit.message != 'Run authorised Wren Workshop storage cleanup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 5.2.3
        shell: bash
        run: |
          set -euo pipefail
          VERSION="5.2.3"
          ARCHIVE="blender-${VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender5.2/${ARCHIVE}" --output "/tmp/${ARCHIVE}"
          mkdir -p /opt/blender
          tar -xf "/tmp/${ARCHIVE}" --directory /opt/blender --strip-components=1
          /opt/blender/blender --version
      - name: Generate Wren and export modular components
        run: |
          set -euo pipefail
          /opt/blender/blender --background --python tools/blender/build_wren_blockout.py
          /opt/blender/blender --background art/characters/wren/wren_blockout.blend --python tools/blender/prepare_wren_sculpt.py
          /opt/blender/blender --background --python tools/blender/export_sculpt_preview.py
          /opt/blender/blender --background art/characters/wren/wren_blockout.blend --python tools/blender/export_character_components.py
          test -s art/characters/wren/wren_blockout.glb
          test -s art/characters/wren/body.glb
      - name: Keep Blender source and exported models as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wren-model-build
          path: |
            art/characters/wren/wren_blockout.blend
            art/characters/wren/wren_sculpt_source.blend
            art/characters/wren/*.glb
          if-no-files-found: error
          retention-days: 14
      - name: Assemble private viewer site
        run: |
          set -euo pipefail
          mkdir -p site/assets
          # The phone viewer currently loads only these two complete models.
          # Keep the modular exports in GitHub build artifacts, not the Space:
          # every unnecessary large LFS asset adds to the Space's storage footprint.
          cp art/characters/wren/wren_blockout.glb site/assets/wren_blockout.glb
          cp art/characters/wren/wren_sculpt_source.glb site/assets/wren_sculpt_source.glb
          printf '%s\\n' "${GITHUB_SHA}" > site/build-version.txt
          test -s site/index.html
          test -s site/README.md
      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish to private Hugging Face Space
        env:
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          test -n "${{ vars.HF_SPACE_ID }}"
          hf upload "${{ vars.HF_SPACE_ID }}" site . --repo-type space --commit-message "Wren Workshop build ${GITHUB_SHA::7}"

  reclaim-space-history:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run authorised Wren Workshop storage cleanup' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Squash Hugging Face Space history
        env:
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE_ID }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = os.environ["HF_SPACE_ID"]
          expected_repo = "Thisisausername836/wren-workshop"
          if repo_id != expected_repo:
              raise SystemExit(f"Refusing to squash unexpected Space: {repo_id!r}")

          api = HfApi()
          before = api.repo_info(repo_id=repo_id, repo_type="space")
          print(f"Space: {repo_id}")
          print(f"Current revision before squash: {before.sha}")

          result = api.super_squash_history(
              repo_id=repo_id,
              branch="main",
              repo_type="space",
              commit_message="Squash Wren Workshop history to reclaim LFS storage",
          )
          print(f"Squash result: {result}")

          after = api.repo_info(repo_id=repo_id, repo_type="space")
          print(f"Current revision after squash: {after.sha}")
          print("History squash completed. Hub storage quota may take up to 36 hours to update.")
          PY
