name: Build Wren Workshop
# Re-run after configuring the HF_ADMIN_TOKEN repository secret.
on:
  workflow_dispatch:
  push:
    branches: [dev, feature/shared-character-system]
    paths:
      - "tools/blender/**"
      - "site/**"
      - "docs/ARA_CHARACTER_EVALUATION.md"
      - ".github/workflows/wren-workshop.yml"
permissions:
  contents: read
concurrency:
  group: wren-workshop
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Ara 3D Gen benchmark
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/olatunde85/3d-gen.git /tmp/ara-3d-gen
          git -C /tmp/ara-3d-gen checkout b60b5bece6d383d2cbb7067fd50e7c8e68b5a395
          cd /tmp/ara-3d-gen
          corepack enable
          pnpm install --no-frozen-lockfile
          npm run setup-assets
          cat > /tmp/ara-wren.params.json <<'JSON'
          {
            "name": "Wren Talbot - Ara benchmark",
            "seed": 218,
            "gender": 0,
            "age": 0.5,
            "muscle": 0.62,
            "weight": 0.42,
            "height": 0.55,
            "proportions": 0.68,
            "african": 0.05,
            "asian": 0.05,
            "caucasian": 0.9,
            "breastSize": 0.5,
            "breastFirmness": 0.55,
            "hair": "braid01",
            "hairTint": "#252b62",
            "outfit": "none",
            "top": "fatigue_shirt",
            "jacket": "none",
            "bottom": "fatigue_pants",
            "underwear": true,
            "shoes": "combat_boots",
            "hat": "none",
            "weapon": "sword",
            "carry": "none",
            "detail": "high",
            "rig": "game",
            "restPose": "A",
            "animations": true,
            "faceBones": true,
            "faceShapes": true,
            "speechShapes": true,
            "expression": "neutral",
            "garmentStyles": {
              "fatigue_shirt": {"pattern":"solid","color":"#244b2b","color2":"#d94a72"},
              "fatigue_pants": {"pattern":"solid","color":"#29292d","color2":"#29292d"}
            }
          }
          JSON
          npm run export -- --params /tmp/ara-wren.params.json --detail high --formats glb --out /tmp/ara-out
          mkdir -p "$GITHUB_WORKSPACE/art/characters/ara"
          find /tmp/ara-out -maxdepth 1 -type f -name '*.glb' -print -quit | grep -q .
          cp /tmp/ara-out/*.glb "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_benchmark.glb"
          cp /tmp/ara-wren.params.json "$GITHUB_WORKSPACE/art/characters/ara/ara_wren.params.json"
          test -s "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_benchmark.glb"

          # Ara body-only adult preview: no garments, underwear or shoes.
          python - <<'PY'
          import json
          p = json.load(open('/tmp/ara-wren.params.json'))
          p.update({
              "name": "Wren Talbot - Ara body no clothing",
              "outfit": "none", "top": "none", "jacket": "none",
              "bottom": "none", "underwear": False, "shoes": "none",
              "hat": "none", "accessories": [], "earrings": "none", "tattoos": []
          })
          json.dump(p, open('/tmp/ara-wren-body.params.json', 'w'), indent=2)
          PY
          mkdir -p /tmp/ara-body-out
          npm run export -- --params /tmp/ara-wren-body.params.json --detail high --formats glb --out /tmp/ara-body-out
          BODY_GLB="$(find /tmp/ara-body-out -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$BODY_GLB"
          cp "$BODY_GLB" "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_body.glb"
          cp /tmp/ara-wren-body.params.json "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_body.params.json"

          # The same adult body with Ara's UV-space tattoo layer enabled.
          python - <<'PY'
          import json
          p = json.load(open('/tmp/ara-wren-body.params.json'))
          p.update({"name": "Wren Talbot - Ara tattooed body", "tattoos": ["armband_l", "forearm_l"], "tattooInk": "#20232a"})
          json.dump(p, open('/tmp/ara-wren-tattoo-body.params.json', 'w'), indent=2)
          PY
          mkdir -p /tmp/ara-tattoo-body-out
          npm run export -- --params /tmp/ara-wren-tattoo-body.params.json --detail high --formats glb --out /tmp/ara-tattoo-body-out
          TATTOO_GLB="$(find /tmp/ara-tattoo-body-out -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$TATTOO_GLB"
          cp "$TATTOO_GLB" "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_tattoo_body.glb"
          cp /tmp/ara-wren-tattoo-body.params.json "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_tattoo_body.params.json"

          # Separate mobile preview: retain the game rig, but reduce geometry detail
          # and bake facial expression / omit animation clips and facial blend shapes.
          python - <<'PY'
          import json
          p = json.load(open('/tmp/ara-wren.params.json'))
          p.update({
              "name": "Wren Talbot - Ara mobile preview",
              "detail": "low",
              "animations": False,
              "faceBones": False,
              "faceShapes": False,
              "speechShapes": False
          })
          json.dump(p, open('/tmp/ara-wren-mobile.params.json', 'w'), indent=2)
          PY
          mkdir -p /tmp/ara-mobile-out
          npm run export -- --params /tmp/ara-wren-mobile.params.json --detail low --formats glb --out /tmp/ara-mobile-out
          MOBILE_GLB="$(find /tmp/ara-mobile-out -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$MOBILE_GLB"
          cp "$MOBILE_GLB" "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_mobile.glb"
          cp /tmp/ara-wren-mobile.params.json "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_mobile.params.json"
          test -s "$GITHUB_WORKSPACE/art/characters/ara/ara_wren_mobile.glb"
      - name: Keep generated models as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: character-pipeline-evaluation
          path: |
            art/characters/ara/ara_wren_benchmark.glb
            art/characters/ara/ara_wren.params.json
            art/characters/ara/ara_wren_mobile.glb
            art/characters/ara/ara_wren_mobile.params.json
            art/characters/ara/ara_wren_body.glb
            art/characters/ara/ara_wren_body.params.json
            art/characters/ara/ara_wren_tattoo_body.glb
            art/characters/ara/ara_wren_tattoo_body.params.json
          if-no-files-found: error
          retention-days: 14
      - name: Assemble private viewer site
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp art/characters/ara/ara_wren_benchmark.glb site/assets/ara_wren_benchmark.glb
          cp art/characters/ara/ara_wren_mobile.glb site/assets/ara_wren_mobile.glb
          cp art/characters/ara/ara_wren_body.glb site/assets/ara_wren_body.glb
          cp art/characters/ara/ara_wren_tattoo_body.glb site/assets/ara_wren_tattoo_body.glb
          printf '%s\\n' "${GITHUB_SHA}" > site/build-version.txt
          test -s site/index.html
          test -s site/README.md
      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish to private Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${{ vars.HF_SPACE_ID }}"
          test -n "$HF_TOKEN"
          # Use the repository's Hugging Face Write token directly. No OIDC exchange.
          hf auth whoami
          hf upload "${{ vars.HF_SPACE_ID }}" site . --repo-type space --commit-message "Wren Workshop build ${GITHUB_SHA::7}"
