name: GDScript indentation

on:
  pull_request:
    branches: [dev]
    paths:
      - "**/*.gd"
      - ".editorconfig"
      - "tools/ci/check_gdscript_indentation.py"
      - ".github/workflows/gdscript-indentation.yml"
  push:
    branches: [dev]
    paths:
      - "**/*.gd"
      - ".editorconfig"
      - "tools/ci/check_gdscript_indentation.py"
      - ".github/workflows/gdscript-indentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdscript-indentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Enforce consistent GDScript indentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed GDScript files only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CHECK_SHA" -- '*.gd')
          if [ "${#changed[@]}" -gt 0 ]; then
            python tools/ci/check_gdscript_indentation.py "${changed[@]}"
          else
            echo "No changed GDScript files to check."
          fi
