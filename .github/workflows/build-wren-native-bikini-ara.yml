name: Build Wren with native Ara bra and briefs

on:
  push:
    branches: [feature/wren-native-bikini-ara-fit-20261126]
    paths:
      - ".github/workflows/build-wren-native-bikini-ara.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wren-native-bikini-ara
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate Wren profile and Blender scripts
        run: |
          set -euo pipefail
          python -m json.tool character-preview/wren-ara.json >/dev/null
          python -m py_compile tools/blender/add_female_anatomy_surface.py tools/blender/add_character_details.py tools/review/render_wren_native.py tools/review/recolor_wren_glb.py tools/blender/plan_female_anatomy_subdivision.py

      - name: Install Blender and numerical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil libegl1 libgl1-mesa-dri

      - name: Generate Wren with Ara-native bra and briefs
        run: |
          set -euo pipefail
          mkdir -p build/wren-native-clothed/ara-export
          python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("character-preview/wren-ara.json").read_text())
          profile.pop("character_details", None)
          profile["underTop"] = "bra"
          profile["underBottom"] = "briefs"
          profile["underwear"] = False
          Path("build/wren-native-clothed/ara-export-profile.json").write_text(json.dumps(profile, indent=2) + "\\n")
          print("Ara clothing slots:", profile["underTop"], profile["underBottom"])
          PY
          npx --yes ara3d@latest export \\
            --params build/wren-native-clothed/ara-export-profile.json \\
            --detail high --no-animations --formats glb,zip \\
            --out build/wren-native-clothed/ara-export
          raw_glb="$(find build/wren-native-clothed/ara-export -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$raw_glb"
          test -s "$raw_glb"
          cp "$raw_glb" build/wren-native-clothed/Wren_Ara_bra_briefs_raw.glb

      - name: Apply Wren's integrated anatomy surface
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-exit-code 1 \\
            --python tools/blender/plan_female_anatomy_subdivision.py -- \\
            --input build/wren-native-clothed/Wren_Ara_bra_briefs_raw.glb \\
            --output build/wren-native-clothed/female-anatomy-subdivision-plan.json
          blender --background --python-exit-code 1 \\
            --python tools/blender/add_female_anatomy_surface.py -- \\
            --input build/wren-native-clothed/Wren_Ara_bra_briefs_raw.glb \\
            --output build/wren-native-clothed/Wren.glb \\
            --report build/wren-native-clothed/female-anatomy-report.json \\
            --subdivision-plan build/wren-native-clothed/female-anatomy-subdivision-plan.json --adult --deformation-scale 1.65
          test -s build/wren-native-clothed/Wren.glb

      - name: Apply Wren profile colours and body hair
        run: |
          set -euo pipefail
          python tools/review/recolor_wren_glb.py \\
            --model build/wren-native-clothed/Wren.glb \\
            --profile character-preview/wren-ara.json --hair-gamma 0.18
          python tools/review/add_aldric_body_hair.py \\
            --model build/wren-native-clothed/Wren.glb --seed 4404 \\
            --coverage wren --hair-colour "#287BFF"
          test -s build/wren-native-clothed/Wren.glb

      - name: Bake Wren's left nipple piercing
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-exit-code 1 \\
            --python tools/blender/add_character_details.py -- \\
            --input build/wren-native-clothed/Wren.glb \\
            --output build/wren-native-clothed/Wren-details.glb \\
            --profile character-preview/wren-ara.json \\
            2>&1 | tee build/wren-native-clothed/character-details-build.log
          test -s build/wren-native-clothed/Wren-details.glb
          grep -q "BAKED_PIERCING Piercing_SOCKET_Nipple_L" build/wren-native-clothed/character-details-build.log
          mv build/wren-native-clothed/Wren-details.glb build/wren-native-clothed/Wren.glb

      - name: Assemble isolated Godot preview project
        run: |
          set -euo pipefail
          preview=build/wren-native-bikini-preview
          mkdir -p "$preview/scripts/presentation" "$preview/build/wren-native" "$preview/tools/review"
          cp build/wren-native-clothed/Wren.glb "$preview/build/wren-native/Wren.glb"
          cp tools/review/wren_native_preview.gd "$preview/tools/review/wren_native_preview.gd"
          cp scripts/presentation/ara_character_details.gd "$preview/scripts/presentation/ara_character_details.gd"
          cat > "$preview/project.godot" <<'EOF'
          ; Isolated Wren native Ara clothing preview.
          config_version=5
          [application]
          config/name="Wren Native Ara Bra and Briefs Preview"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          renderer/rendering_method.web="gl_compatibility"
          EOF

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Import final GLB in Godot
        run: |
          set -euo pipefail
          godot --version
          godot --headless --editor --path build/wren-native-bikini-preview --quit

      - name: Render Wren front, side, three-quarter and detail views
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \\
            godot --path build/wren-native-bikini-preview \\
            --rendering-method gl_compatibility --rendering-driver opengl3 \\
            --script res://tools/review/wren_native_preview.gd
          for view in front side threequarter face pelvis; do
            test -s "build/wren-native-bikini-preview/build/wren-native/preview/$view.png"
          done
          test -s build/wren-native-bikini-preview/build/wren-native/preview/render-report.json
          cp -R build/wren-native-bikini-preview/build/wren-native/preview build/wren-native-clothed/preview

      - name: Package model and provenance
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          root = Path("build/wren-native-clothed")
          report = {
              "source_profile": "character-preview/wren-ara.json",
              "Ara_native_underTop": "bra",
              "Ara_native_underBottom": "briefs",
              "garment_fitting": "Ara generator native clothing slots; no separate Blender garment vertex fitter",
              "body_profile_preserved": True,
              "anatomy_postprocess": "shared-subdivision Wren anatomy surface",
              "piercing": "left nipple piercing baked after clothing generation"
          }
          (root / "BUILD_INFO.json").write_text(json.dumps(report, indent=2) + "\\n")
          with zipfile.ZipFile(root / "Wren_native_Ara_bra_briefs_bundle.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in ("Wren.glb", "BUILD_INFO.json", "female-anatomy-report.json", "character-details-build.log"):
                  p = root / name
                  if p.exists(): archive.write(p, name)
              for view in ("front", "side", "threequarter", "face", "pelvis"):
                  archive.write(root / "preview" / f"{view}.png", f"preview/{view}.png")
          PY

      - name: Upload native Ara clothed Wren and review
        uses: actions/upload-artifact@v7
        with:
          name: wren-native-ara-bra-briefs
          path: |
            build/wren-native-clothed/Wren.glb
            build/wren-native-clothed/Wren_native_Ara_bra_briefs_bundle.zip
            build/wren-native-clothed/BUILD_INFO.json
            build/wren-native-clothed/female-anatomy-report.json
            build/wren-native-clothed/preview/
          if-no-files-found: error
          retention-days: 30
