name: Reconstruct Ara-method bikini briefs independently

on:
  # Also run automatically for the reconstruction PR; no iOS/manual dispatch needed.
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/test-wren-ara-bikini-fit.yml"
      - "tools/blender/generate_ara_method_bikini_bottom.py"
      - "character-preview/wren-ara.json"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ara-method-bikini-reconstruction-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reconstruct:
    name: Single-pass procedural reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || 'dev' }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri

      - name: Build a body-only reference with Wren's accepted Ara proportions
        run: |
          set -euo pipefail
          python -m json.tool character-preview/wren-ara.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("character-preview/wren-ara.json").read_text())
          profile.pop("character_details", None)
          params = profile["params"]
          params["outfit"] = "none"
          params["top"] = "none"
          params["bottom"] = "none"
          params["jacket"] = "none"
          params["underwear"] = False
          Path("build/wren-native/ara-body-only-profile.json").parent.mkdir(parents=True, exist_ok=True)
          Path("build/wren-native/ara-body-only-profile.json").write_text(json.dumps(profile, indent=2) + "\n")
          PY
          mkdir -p build/wren-native/ara-body-export
          npx --yes ara3d@latest export \
            --params build/wren-native/ara-body-only-profile.json \
            --detail high --no-animations --formats glb \
            --out build/wren-native/ara-body-export
          body_glb="$(find build/wren-native/ara-body-export -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$body_glb"
          test -s "$body_glb"
          cp "$body_glb" build/wren-native/Ara_Body_Only_Reference.glb

      - name: Generate briefs in one procedural pass (no Ara garment code or cloth solver)
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/generate_ara_method_bikini_bottom.py
          blender --background --python-exit-code 1 \
            --python tools/blender/generate_ara_method_bikini_bottom.py -- \
            --input build/wren-native/Ara_Body_Only_Reference.glb \
            --output-glb build/wren-native/Ara_Method_Bikini_Bottom.glb \
            --report build/wren-native/ara-method-bikini-report.json
          test -s build/wren-native/Ara_Method_Bikini_Bottom.glb
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/wren-native/ara-method-bikini-report.json").read_text())
          assert report["solver_or_simulation_used"] is False, report
          assert report["body_geometry_modified"] is False, report
          assert report["body_hidden_or_deleted"] is False, report
          assert report["front_panel_grid"] == [16, 15], report
          assert report["back_panel_grid"] == [16, 15], report
          assert report["gusset_grid"] == [9, 15], report
          assert report["surface_lift_mm"] == 3.0, report
          assert report["selected_pelvic_faces"] >= 100, report
          assert len(report["garment_objects"]) >= 7, report
          print("ARA_METHOD_SINGLE_PASS_OK", json.dumps(report, indent=2))
          PY

      - name: Upload independent reconstruction for visual comparison
        uses: actions/upload-artifact@v7
        with:
          name: ara-method-bikini-reconstruction-${{ github.run_number }}
          path: |
            build/wren-native/Ara_Body_Only_Reference.glb
            build/wren-native/Ara_Method_Bikini_Bottom.glb
            build/wren-native/ara-method-bikini-report.json
            build/wren-native/preview/
          if-no-files-found: error
          retention-days: 30
