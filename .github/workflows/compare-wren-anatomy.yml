name: Compare accepted Wren with uploaded anatomy sculpt

on:
  push:
    branches: [feature/wren-anatomy-comparison]
    paths:
      - "tools/blender/add_adult_anatomy_uploaded_comparison.py"
      - "tools/review/add_aldric_body_hair.py"
      - ".github/workflows/compare-wren-anatomy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: compare-wren-anatomy
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Download the exact accepted Wren build
        uses: actions/download-artifact@v4
        with:
          name: wren-native-ara-90
          run-id: 44452903123
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ScottENOC/Silverhart-Saga-3D
          path: build/wren-anatomy/accepted-artifact

      - name: Preserve accepted Wren as the baseline
        run: |
          set -euo pipefail
          mkdir -p build/wren-anatomy/current build/wren-anatomy/uploaded-script build/wren-anatomy/donor
          source_glb="$(find build/wren-anatomy/accepted-artifact -maxdepth 2 -type f -name 'Wren.glb' -print -quit)"
          test -n "$source_glb"
          test -s "$source_glb"
          cp "$source_glb" build/wren-anatomy/current/Wren.glb
          cp "$source_glb" build/wren-anatomy/uploaded-script/Wren-input.glb
          sha256sum build/wren-anatomy/current/Wren.glb | tee build/wren-anatomy/accepted-source.sha256

      - name: Build a clean Wren skin texture donor from the same Ara profile
        run: |
          set -euo pipefail
          python -m json.tool character-preview/wren-ara.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("character-preview/wren-ara.json").read_text())
          Path("build/wren-anatomy/donor/profile.json").write_text(
              json.dumps(profile["params"], indent=2) + "\\n"
          )
          PY
          npx --yes ara3d@latest export \
            --params build/wren-anatomy/donor/profile.json \
            --detail high --no-animations --formats glb \
            --out build/wren-anatomy/donor/export
          donor="$(find build/wren-anatomy/donor/export -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$donor"
          cp "$donor" build/wren-anatomy/donor/Wren_Ara_texture_source.glb
          python tools/review/recolor_wren_glb.py \
            --model build/wren-anatomy/donor/Wren_Ara_texture_source.glb \
            --profile character-preview/wren-ara.json --hair-gamma 0.18

      - name: Apply the uploaded anatomy script only to the comparison copy
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil libegl1 libgl1-mesa-dri xvfb
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-exit-code 1 \
            --python tools/blender/add_adult_anatomy_uploaded_comparison.py -- \
            --input build/wren-anatomy/uploaded-script/Wren-input.glb \
            --output build/wren-anatomy/uploaded-script/Wren.glb \
            --profile female --adult --method integrated --deformation-scale 1.65 \
            2>&1 | tee build/wren-anatomy/uploaded-script/anatomy-build.log
          test -s build/wren-anatomy/uploaded-script/Wren.glb
          grep -q "Female anatomy v2:" build/wren-anatomy/uploaded-script/anatomy-build.log

      - name: Relocate Wren's blue landing strip above the anatomy on both copies
        run: |
          set -euo pipefail
          for variant in current uploaded-script; do
            python tools/review/add_aldric_body_hair.py \
              --model "build/wren-anatomy/$variant/Wren.glb" \
              --seed 4404 --coverage wren --hair-colour "#287BFF" \
              --base-texture-glb build/wren-anatomy/donor/Wren_Ara_texture_source.glb \
              --wren-y0 0.535 --wren-y1 0.565
          done

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Render both copies through the same Godot preview
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          for variant in current uploaded-script; do
            project="build/wren-anatomy/$variant/preview-project"
            mkdir -p "$project/build/wren-native" "$project/tools/review" "$project/scripts/presentation"
            cp "build/wren-anatomy/$variant/Wren.glb" "$project/build/wren-native/Wren.glb"
            cp tools/review/wren_native_preview.gd "$project/tools/review/wren_native_preview.gd"
            cp scripts/presentation/ara_character_details.gd "$project/scripts/presentation/ara_character_details.gd"
            cat > "$project/project.godot" <<'EOF'
          ; Isolated Wren anatomy comparison preview.
          config_version=5
          [application]
          config/name="Wren Anatomy Comparison"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          renderer/rendering_method.web="gl_compatibility"
          EOF
            godot --headless --editor --path "$project" --quit
            xvfb-run -a -s "-screen 0 1280x1024x24" \
              godot --path "$project" --rendering-method gl_compatibility \
              --rendering-driver opengl3 --script res://tools/review/wren_native_preview.gd
            for view in front side threequarter face pelvis; do
              test -s "$project/build/wren-native/preview/$view.png"
            done
            cp -R "$project/build/wren-native/preview" "build/wren-anatomy/$variant/godot-preview"
          done

      - name: Write provenance report and package comparison
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("build/wren-anatomy")
          report = {
              "purpose": "Compare the exact accepted Wren build with a copy receiving the uploaded anatomy script.",
              "accepted_source_run_id": 44452903123,
              "accepted_source_artifact": "wren-native-ara-90",
              "accepted_source_commit": "a70421b41001bea4224bb08190ee3b184fe195aa",
              "baseline": "Exact accepted Wren.glb copied from the 19 November native Ara workflow artifact; no anatomy pass rerun.",
              "candidate": "A copy of that exact GLB, passed through add_adult_anatomy_uploaded_comparison.py only.",
              "shared_post_steps": [
                  "Rebake Wren landing strip at normalized body height 0.535-0.565 using the same clean Ara skin texture donor",
                  "Godot 4.7.2 preview using identical lighting and camera views"
              ],
              "hair_note": "Both copies receive the same revised landing-strip placement above the anatomy; the old blue texture patch is replaced from the clean donor texture.",
              "candidates": {}
          }
          for name in ("current", "uploaded-script"):
              payload = (root / name / "Wren.glb").read_bytes()
              report["candidates"][name] = {
                  "glb_bytes": len(payload),
                  "glb_sha256": hashlib.sha256(payload).hexdigest()
              }
          (root / "comparison-report.json").write_text(json.dumps(report, indent=2) + "\\n")
          (root / "README.txt").write_text(
              "WREN ACCEPTED-BUILD COMPARISON\\n\\n"
              "current/Wren.glb: exact accepted Wren GLB from native build run 44452903123, with only the shared landing-strip texture correction applied.\\n"
              "uploaded-script/Wren.glb: same accepted GLB with the uploaded anatomy script applied, then the same landing-strip correction.\\n\\n"
              "Both use identical Godot 4.7.2 camera views. Neither candidate is promoted automatically.\\n"
          )
          PY

      - name: Upload both GLBs, reports and visual reviews
        uses: actions/upload-artifact@v7
        with:
          name: wren-accepted-build-comparison-${{ github.run_number }}
          path: |
            build/wren-anatomy/README.txt
            build/wren-anatomy/comparison-report.json
            build/wren-anatomy/accepted-source.sha256
            build/wren-anatomy/current/Wren.glb
            build/wren-anatomy/current/godot-preview/
            build/wren-anatomy/uploaded-script/Wren.glb
            build/wren-anatomy/uploaded-script/anatomy-build.log
            build/wren-anatomy/uploaded-script/godot-preview/
          if-no-files-found: error
          retention-days: 30
