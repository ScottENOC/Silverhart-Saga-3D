name: Character preview
on:
  push:
    branches: [dev_2]
    paths:
      - "character-preview/profile.json"
      - "tools/review/render_character_preview.py"
      - ".github/workflows/character-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: character-preview
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_2
      - name: Validate preview script and profile
        run: |
          python -m py_compile tools/review/render_character_preview.py
          python -m json.tool character-preview/profile.json >/dev/null
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Render character views
        run: |
          mkdir -p build/character-preview
          export PYTHONPATH=/usr/lib/python3/dist-packages:$PYTHONPATH
          blender --background --python-exit-code 1 --python tools/review/render_character_preview.py -- character-preview/profile.json build/character-preview "$GITHUB_WORKSPACE"
          test -s build/character-preview/front.png
          test -s build/character-preview/side.png
          test -s build/character-preview/rear.png
      - name: Upload preview images
        uses: actions/upload-artifact@v4
        with:
          name: character-preview-${{ github.run_number }}
          path: build/character-preview/
          if-no-files-found: error
          retention-days: 14
