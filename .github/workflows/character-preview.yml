name: Character preview
on:
  push:
    branches: [dev_2]
    paths:
      - "character-preview/profile.json"
      - "tools/review/render_character_preview.py"
      - ".github/workflows/character-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: character-preview
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_2
      - name: Validate preview script and profile
        run: |
          python -m py_compile tools/review/render_character_preview.py
          python -m json.tool character-preview/profile.json >/dev/null
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Create neutral baseline profile
        run: |
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("character-preview/profile.json").read_text())
          p["name"] = "Ara neutral baseline"
          p["shape_keys"] = {key: 0.0 for key in p.get("shape_keys", {})}
          Path("build/ara-baseline-profile.json").write_text(json.dumps(p, indent=2))
          PY
      - name: Render neutral baseline and Wren comparison
        run: |
          mkdir -p build/character-preview/baseline build/character-preview/wren
          export PYTHONPATH=/usr/lib/python3/dist-packages:$PYTHONPATH
          blender --background --python-exit-code 1 --python tools/review/render_character_preview.py -- build/ara-baseline-profile.json build/character-preview/baseline "$GITHUB_WORKSPACE"
          blender --background --python-exit-code 1 --python tools/review/render_character_preview.py -- character-preview/profile.json build/character-preview/wren "$GITHUB_WORKSPACE"
          for view in front side rear; do
            test -s "build/character-preview/baseline/$view.png"
            test -s "build/character-preview/wren/$view.png"
          done
      - name: Upload preview images
        uses: actions/upload-artifact@v4
        with:
          name: character-preview-${{ github.run_number }}
          path: build/character-preview/
          if-no-files-found: error
          retention-days: 14
