name: Export Wren GLB

# Legacy exporter retained for manual recovery only.
# Automatic companion builds now use build-wren-native-ara.yml, which applies
# the accepted Ara profile, integrated adult anatomy, Wren colours/details,
# and a Godot review pass. The old wren.json path is not an authoritative Wren.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: export-wren-glb
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Validate exporter and Wren profile
        run: |
          python -m py_compile tools/review/export_character_glb.py
          python -m json.tool character-preview/wren.json >/dev/null
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Assemble and export Wren GLB
        run: |
          mkdir -p build/wren
          export PYTHONPATH=/usr/lib/python3/dist-packages:$PYTHONPATH
          blender --background --python-exit-code 1 --python tools/review/export_character_glb.py -- character-preview/wren.json build/wren/Wren.glb "$GITHUB_WORKSPACE"
          test -s build/wren/Wren.glb
          test -s build/wren/Wren-export-report.json
      - name: Upload Wren GLB and export report
        uses: actions/upload-artifact@v4
        with:
          name: wren-character-glb-${{ github.run_number }}
          path: build/wren/
          if-no-files-found: error
          retention-days: 30

  native-ara:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Wren from Ara's MakeHuman morph dataset
        run: |
          mkdir -p build/wren-native
          npx --yes ara3d@latest export --params character-preview/wren-ara.json --detail high --no-animations --formats glb,zip --out build/wren-native
          glb="$(find build/wren-native -maxdepth 1 -type f -name '*.glb' | head -n 1)"
          test -n "$glb"
          test -s "$glb"
          echo "Native Ara GLB: $glb"
          echo "=== Generated files ==="
          ls -lh build/wren-native
      - name: Upload native Ara Wren and regeneration bundle
        uses: actions/upload-artifact@v4
        with:
          name: wren-native-ara-${{ github.run_number }}
          path: build/wren-native/
          if-no-files-found: error
          retention-days: 30
