name: Male anatomy blockout

on:
  push:
    branches:
      - feature/male-anatomy-skinned-mesh
    paths:
      - "tools/blender/add_male_anatomy.py"
      - ".github/workflows/male-anatomy.yml"
  pull_request:
    branches: [dev]
    paths:
      - "tools/blender/add_male_anatomy.py"
      - ".github/workflows/male-anatomy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate adult male Ara base body
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/olatunde85/3d-gen.git /tmp/ara-3d-gen
          git -C /tmp/ara-3d-gen checkout b60b5bece6d383d2cbb7067fd50e7c8e68b5a395
          cd /tmp/ara-3d-gen
          corepack enable
          pnpm install --no-frozen-lockfile
          npm run setup-assets
          cat > /tmp/ara-male.params.json <<'JSON'
          {
            "name": "Ara Male Base - adult anatomy review",
            "seed": 417,
            "gender": 1,
            "age": 0.5,
            "muscle": 0.5,
            "weight": 0.5,
            "height": 0.5,
            "proportions": 0.5,
            "african": 0.05,
            "asian": 0.05,
            "caucasian": 0.9,
            "hair": "short02",
            "hairTint": "#2a1e16",
            "outfit": "none",
            "top": "none",
            "jacket": "none",
            "bottom": "none",
            "underTop": "none",
            "underBottom": "none",
            "underwear": false,
            "shoes": "none",
            "hat": "none",
            "weapon": "none",
            "carry": "none",
            "detail": "high",
            "rig": "game",
            "restPose": "A",
            "animations": true,
            "faceBones": true,
            "faceShapes": true,
            "speechShapes": true,
            "expression": "neutral"
          }
          JSON
          mkdir -p /tmp/ara-male-out
          npm run export -- --params /tmp/ara-male.params.json --detail high --formats glb --out /tmp/ara-male-out
          INPUT="$(find /tmp/ara-male-out -maxdepth 1 -type f -name '*.glb' -print -quit)"
          test -n "$INPUT"
          mkdir -p "$GITHUB_WORKSPACE/art/characters/ara-male"
          cp "$INPUT" "$GITHUB_WORKSPACE/art/characters/ara-male/ara_male_raw.glb"
          cp /tmp/ara-male.params.json "$GITHUB_WORKSPACE/art/characters/ara-male/ara_male.params.json"
      - name: Install portable Blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_VERSION="4.2.23"
          BLENDER_ARCHIVE="/tmp/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output "$BLENDER_ARCHIVE"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$BLENDER_ARCHIVE" --strip-components=1 -C "$RUNNER_TEMP/blender"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --version
      - name: Install system graphics libraries for headless review
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libx11-6 libxxf86vm1 libxfixes3 libxrender1 libxi6 libxkbcommon0
      - name: Build skinned anatomy and review renders
        shell: bash
        run: |
          set -euo pipefail
          export EGL_PLATFORM=surfaceless
          export LIBGL_ALWAYS_SOFTWARE=1
          blender --background --python-exit-code 1 --python tools/blender/add_male_anatomy.py -- \
            --input art/characters/ara-male/ara_male_raw.glb \
            --output art/characters/ara-male/ara_male_anatomy.glb --adult
          REVIEW_INPUT=art/characters/ara-male/ara_male_anatomy.glb \
            REVIEW_OUTPUT_DIR=art/characters/ara-male/review \
            blender --background --python-exit-code 1 --python tools/blender/inspect_character.py
          for view in front side rear three_quarter; do
            test -s "art/characters/ara-male/review/$view.png"
          done
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ara-male-anatomy-review
          path: |
            art/characters/ara-male/*.glb
            art/characters/ara-male/*.json
            art/characters/ara-male/review/*.png
          if-no-files-found: error
          retention-days: 14
