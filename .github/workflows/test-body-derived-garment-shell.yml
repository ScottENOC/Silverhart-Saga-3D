name: Validate body-derived garment shell core

on:
  push:
    branches: [feature/body-derived-garment-shell]
    paths:
      - "tools/blender/garment_shell/**"
      - ".github/workflows/test-body-derived-garment-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile and run geometry tests
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/garment_shell/shell_core.py
          python -m unittest discover -s tools/blender/garment_shell -p 'test_*.py' -v
