name: Aldric and Wren contact-pose review

on:
  push:
    branches: [feature/aldric-wren-kiss-contact-pose]
    paths:
      - "tools/review/aldric_wren_kiss_contact_scene.gd"
      - "tools/review/aldric_wren_kiss_contact_blender.py"
      - ".github/workflows/aldric-wren-contact-pose-review.yml"
  pull_request:
    branches: [feature/anatomy-integrated-body-pressure]
    paths:
      - "tools/review/aldric_wren_kiss_contact_scene.gd"
      - "tools/review/aldric_wren_kiss_contact_blender.py"
      - ".github/workflows/aldric-wren-contact-pose-review.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: aldric-wren-contact-pose-review
  cancel-in-progress: true

jobs:
  export-contact-pose:
    name: Bake and render paired native contact pose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Fetch current native Wren and Aldric builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/aldric-native
          wren_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          aldric_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-aldric-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$wren_run" != "null" && test "$aldric_run" != "null"
          wren_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$wren_run" --jq '.run_number')
          aldric_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$aldric_run" --jq '.run_number')
          gh run download "$wren_run" --name "wren-native-ara-$wren_number" --dir build/wren-download
          gh run download "$aldric_run" --name "aldric-native-ara-$aldric_number" --dir build/aldric-download
          cp build/wren-download/Wren.glb build/wren-native/Wren.glb
          cp build/aldric-download/Aldric.glb build/aldric-native/Aldric.glb
          test -s build/wren-native/Wren.glb
          test -s build/aldric-native/Aldric.glb

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb libgl1-mesa-dri

      - name: Bake, render and export the paired pose
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          blender --background --python tools/review/aldric_wren_kiss_contact_blender.py 2>&1 | tee build-pose.log
          test -s build/aldric-wren-kiss-contact/aldric-wren-kiss-contact.glb
          test -s build/aldric-wren-kiss-contact/pose-preview.png
          test -s build/aldric-wren-kiss-contact/pose-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/aldric-wren-kiss-contact/pose-report.json").read_text())
          assert report["validation"]["four_ik_chains_created"], report["ik_chains"]
          assert report["validation"]["posed_preview_rendered"]
          assert report["validation"]["glb_exported"]
          assert report["character_height"]["aldric"] > report["character_height"]["wren"]
          print("Height-aware pose export checks passed.")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload paired pose and visual QA for iPhone review
        uses: actions/upload-artifact@v7
        with:
          name: aldric-wren-kiss-contact-pose
          path: build/aldric-wren-kiss-contact/
          if-no-files-found: error
          retention-days: 30
