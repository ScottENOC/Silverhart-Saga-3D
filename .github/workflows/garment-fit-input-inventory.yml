name: Garment fit input inventory

on:
  push:
    branches:
      - feature/garment-fit-solver-foundation
    paths:
      - "tools/blender/garment_fit/**"
      - ".github/workflows/garment-fit-input-inventory.yml"
      - "art/characters/ara_runtime/ara_person_body.glb"
  pull_request:
    paths:
      - "tools/blender/garment_fit/**"
      - ".github/workflows/garment-fit-input-inventory.yml"
      - "art/characters/ara_runtime/ara_person_body.glb"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download latest successful Wren native build from dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/garment-fit-input-inventory
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$run_id" != "null"
          run_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.run_number')
          gh run download "$run_id" --name "wren-native-ara-$run_number" --dir build/wren-native
          test -s build/wren-native/Wren.glb
          echo "WREN_BUILD_RUN=$run_id" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.head_sha' > build/garment-fit-input-inventory/wren-source-sha.txt

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri

      - name: Inventory actual Ara and Wren GLBs
        run: |
          set -euo pipefail
          blender --background --python-exit-code 1 --python tools/blender/garment_fit/inspect_fit_inputs.py -- \
            --input art/characters/ara_runtime/ara_person_body.glb \
            --output build/garment-fit-input-inventory/ara-body.json
          blender --background --python-exit-code 1 --python tools/blender/garment_fit/inspect_fit_inputs.py -- \
            --input build/wren-native/Wren.glb \
            --output build/garment-fit-input-inventory/wren-native.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/garment-fit-input-inventory")
          reports = {name: json.loads((root / filename).read_text())
                     for name, filename in {
                       "Ara": "ara-body.json",
                       "Wren": "wren-native.json",
                     }.items()}
          failed = []
          for name, report in reports.items():
              validation = report["validation"]
              if not validation["has_mesh"]:
                  failed.append(f"{name}: no mesh objects")
              if not validation["has_skin_material_faces"]:
                  failed.append(f"{name}: no skin-material faces")
              if not validation["has_armature"]:
                  failed.append(f"{name}: no armature")
              if validation["ambiguous_skin_mesh_candidates"]:
                  failed.append(f"{name}: multiple skin mesh candidates")
              print(name, {
                  "mesh_count": report["mesh_count"],
                  "skin_candidates": report["skin_candidates"],
                  "garment_candidates": report["garment_candidates"],
                  "rigs": [{"name": rig["name"], "bone_count": rig["bone_count"]}
                           for rig in report["rigs"]],
              })
          if failed:
              raise SystemExit("; ".join(failed))
          PY
          printf '{"wren_build_run":%s}\n' "$WREN_BUILD_RUN" > build/garment-fit-input-inventory/provenance.json

      - uses: actions/upload-artifact@v7
        with:
          name: garment-fit-input-inventory
          path: build/garment-fit-input-inventory/
          if-no-files-found: error
          retention-days: 30
