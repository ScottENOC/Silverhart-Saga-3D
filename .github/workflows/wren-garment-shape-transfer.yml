name: Fit garment shape keys to Wren body shapes

on:
  workflow_dispatch:
  pull_request:
    branches: [feature/wren-standard-briefs-fit]
    paths:
      - ".github/workflows/wren-garment-shape-transfer.yml"
      - "tools/blender/garment_fit/transfer_body_shapes.py"
      - "tools/blender/garment_fit/fit_glb.py"
      - "tools/blender/garment_fit/solver_core.py"
      - "tools/ara/assemble_modular_glb.py"
  push:
    branches: [feature/makehuman-garment-shape-transfer-20261125]
    paths:
      - ".github/workflows/wren-garment-shape-transfer.yml"
      - "tools/blender/garment_fit/transfer_body_shapes.py"
      - "tools/blender/garment_fit/fit_glb.py"
      - "tools/blender/garment_fit/solver_core.py"
      - "tools/ara/assemble_modular_glb.py"

permissions:
  actions: read
  contents: read

jobs:
  shape-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Download latest successful native Wren build from dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/garment-shape-fit
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$run_id" != "null"
          run_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.run_number')
          gh run download "$run_id" --name "wren-native-ara-$run_number" --dir build/wren-native
          test -s build/wren-native/Wren.glb
          echo "WREN_BUILD_RUN=$run_id" >> "$GITHUB_ENV"
          echo "WREN_BUILD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.head_sha')" >> "$GITHUB_ENV"

      - name: Validate inputs and Python syntax
        run: |
          set -euo pipefail
          test -s art/characters/ara_runtime/ara_person_benchmark.glb
          python -m py_compile tools/ara/assemble_modular_glb.py tools/blender/garment_fit/solver_core.py tools/blender/garment_fit/fit_glb.py tools/blender/garment_fit/transfer_body_shapes.py

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri

      - name: Assemble Ara modular garments on Wren's canonical rig
        run: |
          set -euo pipefail
          python tools/ara/assemble_modular_glb.py \
            build/wren-native/Wren.glb \
            build/garment-shape-fit/wren-garments-source.glb \
            art/characters/ara_runtime/ara_person_benchmark.glb "Briefs" \
            art/characters/ara_runtime/ara_person_benchmark.glb "Bra"
          test -s build/garment-shape-fit/wren-garments-source.glb

      - name: Fit garment Basis to Wren's undeformed skin surface
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          blender --background --python-exit-code 1 \
            --python tools/blender/garment_fit/fit_glb.py -- \
            --input build/garment-shape-fit/wren-garments-source.glb \
            --output build/garment-shape-fit/wren-garments-basis-fit.glb \
            --report build/garment-shape-fit/basis-fit-report.json \
            --skin-material Skin_Anatomy \
            --garment-material Briefs --garment-material Bra \
            --fit-mode existing

      - name: Transfer every Wren body shape key onto garment surfaces
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          blender --background --python-exit-code 1 \
            --python tools/blender/garment_fit/transfer_body_shapes.py -- \
            --input build/garment-shape-fit/wren-garments-basis-fit.glb \
            --output build/garment-shape-fit/wren-garments-shape-fitted.glb \
            --report build/garment-shape-fit/shape-transfer-report.json \
            --body-material Skin_Anatomy \
            --garment-material Briefs --garment-material Bra \
            --max-surface-distance-mm 35 \
            --minimum-mapped-fraction 0.995
          test -s build/garment-shape-fit/wren-garments-shape-fitted.glb
          test -s build/garment-shape-fit/shape-transfer-report.json

      - name: Upload fitted GLBs and correspondence diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wren-garment-shape-transfer
          path: build/garment-shape-fit/
          if-no-files-found: warn
          retention-days: 30
