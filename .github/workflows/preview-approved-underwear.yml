name: Preview approved companion underwear outfits
# Mirabel's garment source is re-exported against her exact accepted Ara profile.

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/preview-approved-underwear.yml"
      - "tools/ara/apply_outfit_materials.py"
      - "tools/ara/assemble_modular_glb.py"
      - "tools/ara/build_character_outfit_source.py"
      - "tools/ara/patch_layering.py"
      - "character-preview/mirabel-ara.json"
      - "tools/review/render_modular_outfits.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Download accepted Wren #111 body artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44489910457
          artifact-ids: 14512795917
          path: /tmp/approved/wren

      - name: Download accepted Dagna #56 body artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44489910404
          artifact-ids: 14512189420
          path: /tmp/approved/dagna


      - name: Download accepted Mirabel #114 body artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44620790936
          artifact-ids: 14575603958
          path: /tmp/approved/mirabel

      - name: Locate accepted body GLBs and validate source garment catalogue
        shell: bash
        run: |
          set -euo pipefail
          WREN="$(find /tmp/approved/wren -type f -name 'Wren.glb' -print -quit)"
          DAGNA="$(find /tmp/approved/dagna -type f -name 'Dagna.glb' -print -quit)"
          MIRABEL="$(find /tmp/approved/mirabel -type f -name 'Mirabel.glb' -print -quit)"
          test -n "$WREN" && test -s "$WREN"
          test -n "$DAGNA" && test -s "$DAGNA"
          test -n "$MIRABEL" && test -s "$MIRABEL"
          test -s art/characters/ara_runtime/ara_person_modular_underwear.glb
          mkdir -p build/approved-underwear
          cp "$WREN" build/approved-underwear/Wren-body-approved-111.glb
          cp "$DAGNA" build/approved-underwear/Dagna-body-approved-56.glb
          cp "$MIRABEL" build/approved-underwear/Mirabel-body-approved-114.glb

      - name: Build Mirabel underwear against her accepted Ara body profile
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/olatunde85/3d-gen.git /tmp/ara-3d-gen
          git -C /tmp/ara-3d-gen checkout b60b5bece6d383d2cbb7067fd50e7c8e68b5a395
          cd /tmp/ara-3d-gen
          corepack enable
          pnpm install --no-frozen-lockfile
          npm run setup-assets
          python "$GITHUB_WORKSPACE/tools/ara/patch_layering.py"
          python -m py_compile "$GITHUB_WORKSPACE/tools/ara/build_character_outfit_source.py"
          python "$GITHUB_WORKSPACE/tools/ara/build_character_outfit_source.py" \
            --profile "$GITHUB_WORKSPACE/character-preview/mirabel-ara.json" \
            --output "$GITHUB_WORKSPACE/build/approved-underwear/Mirabel-underwear-fit-source.glb" \
            --under-top bra \
            --under-bottom bikini_bottom \
            --colour "#0F52BA" \
            --detail high

      - name: Assemble outfits from independent Ara garment primitives
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=art/characters/ara_runtime/ara_person_modular_underwear.glb
          python tools/ara/assemble_modular_glb.py \
            build/approved-underwear/Wren-body-approved-111.glb \
            build/approved-underwear/Wren-assembled.glb \
            "$SOURCE" "Triangle bikini top" \
            "$SOURCE" "Triangle bikini strings" \
            "$SOURCE" "String bikini bottom" \
            "$SOURCE" "String bikini strings"
          python tools/ara/apply_outfit_materials.py \
            --input build/approved-underwear/Wren-assembled.glb \
            --output build/approved-underwear/Wren-underwear-preview.glb \
            --materials "Triangle bikini top" "Triangle bikini strings" "String bikini bottom" "String bikini strings" \
            --colour "#171717" --alpha 0.5
          python tools/ara/assemble_modular_glb.py \
            build/approved-underwear/Dagna-body-approved-56.glb \
            build/approved-underwear/Dagna-assembled.glb \
            "$SOURCE" "Bra" \
            "$SOURCE" "Briefs"
          python tools/ara/apply_outfit_materials.py \
            --input build/approved-underwear/Dagna-assembled.glb \
            --output build/approved-underwear/Dagna-underwear-preview.glb \
            --materials "Bra" "Briefs" \
            --colour "#788578" --alpha 1.0
          MIRABEL_SOURCE=build/approved-underwear/Mirabel-underwear-fit-source.glb
          test -s "$MIRABEL_SOURCE"
          python tools/ara/assemble_modular_glb.py \
            build/approved-underwear/Mirabel-body-approved-114.glb \
            build/approved-underwear/Mirabel-assembled.glb \
            "$MIRABEL_SOURCE" "Bra" \
            "$MIRABEL_SOURCE" "Bikini bottom" \
            "$MIRABEL_SOURCE" "Bikini strings*=Bikini strings"
          python tools/ara/apply_outfit_materials.py \
            --input build/approved-underwear/Mirabel-assembled.glb \
            --output build/approved-underwear/Mirabel-underwear-preview.glb \
            --materials "Bra" "Bikini bottom" "Bikini strings" \
            --colour "#0F52BA" --alpha 1.0
          test -s build/approved-underwear/Mirabel-underwear-preview.glb
          test -s build/approved-underwear/Wren-underwear-preview.glb
          test -s build/approved-underwear/Dagna-underwear-preview.glb

      - name: Install Blender and render outfit reviews
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Render front, side and rear views for both outfits
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p build/approved-underwear/review
          for entry in "Wren-underwear-preview.glb:wren_starting" "Dagna-underwear-preview.glb:dagna_starting" "Mirabel-underwear-preview.glb:mirabel_underwear"; do
            file="${entry%%:*}"
            preset="${entry##*:}"
            blender --background --python-exit-code 1 \
              --python tools/review/render_modular_outfits.py -- \
              "build/approved-underwear/$file" \
              build/approved-underwear/review "$preset"
            for view in front side rear; do
              test -s "build/approved-underwear/review/$preset/$view.png"
            done
            test -s "build/approved-underwear/review/$preset/report.json"
          done

      - name: Upload approved-body outfit previews
        uses: actions/upload-artifact@v7
        with:
          name: approved-companion-underwear-previews
          path: build/approved-underwear/
          if-no-files-found: error
          retention-days: 30
