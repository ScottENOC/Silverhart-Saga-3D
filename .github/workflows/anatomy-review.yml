name: Male and female anatomy with briefs

on:
  push:
    branches:
      - feature/unified-character-assembly
      - feature/anatomy-geometry-revision
      - feature/anatomy-morph-sculpt-tests
    paths:
      - "tools/build_ara_runtime_local.py"
      - "tools/blender/add_adult_anatomy.py"
      - "tools/blender/add_male_anatomy.py"
      - "tools/review/render_modular_outfits.py"
      - "tools/blender/add_adult_anatomy_claude.py"
      - "tools/ara/patch_layering.py"
      - "tools/ara/assemble_modular_glb.py"
      - "tools/character_definitions.py"
      - "data/items/item_definitions.json"
      - ".github/workflows/anatomy-review.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anatomy-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review:
    name: Build male and female anatomy and briefs
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Blender, NumPy and headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender python3-numpy libgl1 libegl1 libgl1-mesa-dri libgles2

      - name: Verify Blender can import NumPy
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python-expr "import sys; import numpy; print('Blender Python:', sys.version); print('NumPy:', numpy.__version__)"

      - name: Test Blender glTF vertex-colour round-trip
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: blender --background --python tools/blender/test_gltf_vertex_colours.py

      - name: Cache Ara exports and stage manifests
        uses: actions/cache@v4
        with:
          path: |
            build/local-cache/ara
            art/characters/ara
          key: ara-underwear-${{ runner.os }}-${{ hashFiles('tools/build_ara_runtime_local.py', 'tools/ara/patch_layering.py', 'tools/character_definitions.py', 'data/items/item_definitions.json') }}
          restore-keys: |
            ara-underwear-${{ runner.os }}-

      - name: Cache accepted integrated female body
        uses: actions/cache@v4
        with:
          path: build/anatomy-review/female_average_claude_integrated.glb
          key: ara-female-integrated-${{ runner.os }}-${{ hashFiles('tools/blender/add_adult_anatomy_claude.py', 'tools/blender/add_adult_anatomy.py', 'tools/build_ara_runtime_local.py', 'tools/character_definitions.py') }}
          restore-keys: |
            ara-female-integrated-${{ runner.os }}-

      - name: Enable Corepack
        run: corepack enable

      - name: Build male and female anatomy and underwear outputs
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: python tools/build_ara_runtime_local.py --underwear-review-only

      - name: Push male and female anatomy outputs to dev and dev_2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_dir="$GITHUB_WORKSPACE/build/anatomy-review"
          test -s "$source_dir/female_average_claude_integrated.glb"
          test -s "$source_dir/female_average_briefs.glb"
          test -s "$source_dir/male_average_flaccid.glb"
          test -s "$source_dir/male_average_flaccid_briefs.glb"
          for target in dev dev_2; do
            git fetch origin "$target"
            worktree="$(mktemp -d)"
            git worktree add --detach "$worktree" "origin/$target"
            mkdir -p "$worktree/art/characters/ara"
            cp "$source_dir/female_average_claude_integrated.glb" "$worktree/art/characters/ara/ara_person_body.glb"
            cp "$source_dir/female_average_briefs.glb" "$worktree/art/characters/ara/ara_person_body_briefs.glb"
            cp "$source_dir/male_average_flaccid.glb" "$worktree/art/characters/ara/ara_person_male_body.glb"
            cp "$source_dir/male_average_flaccid_briefs.glb" "$worktree/art/characters/ara/ara_person_male_body_briefs.glb"
            git -C "$worktree" add art/characters/ara/ara_person_body.glb art/characters/ara/ara_person_body_briefs.glb art/characters/ara/ara_person_male_body.glb art/characters/ara/ara_person_male_body_briefs.glb
            if ! git -C "$worktree" diff --cached --quiet; then
              git -C "$worktree" commit -m "Add male and female anatomy outputs with briefs"
              git -C "$worktree" push origin "HEAD:$target"
            else
              echo "Anatomy outputs already current on $target"
            fi
            git worktree remove --force "$worktree"
          done

      - name: Upload anatomy review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silverhart-average-body-anatomy-review
          path: build/anatomy-review/
          if-no-files-found: warn
          retention-days: 14
