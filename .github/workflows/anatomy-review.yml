name: Female underwear fit review

on:
  push:
    branches:
      - feature/unified-character-assembly
      - feature/anatomy-geometry-revision
      - feature/anatomy-morph-sculpt-tests
    paths:
      - "tools/build_ara_runtime_local.py"
      - "tools/blender/add_adult_anatomy.py"
      - "tools/review/render_modular_outfits.py"
      - "tools/blender/add_adult_anatomy_claude.py"
      - "tools/ara/patch_layering.py"
      - "tools/ara/assemble_modular_glb.py"
      - "tools/character_definitions.py"
      - "data/items/item_definitions.json"
      - ".github/workflows/anatomy-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anatomy-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review:
    name: Build female underwear fit review
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Blender, NumPy and headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender python3-numpy libgl1 libegl1 libgl1-mesa-dri libgles2

      - name: Verify Blender can import NumPy
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python-expr "import sys; import numpy; print('Blender Python:', sys.version); print('NumPy:', numpy.__version__)"

      - name: Test Blender glTF vertex-colour round-trip
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: blender --background --python tools/blender/test_gltf_vertex_colours.py

      - name: Cache Ara exports and stage manifests
        uses: actions/cache@v4
        with:
          path: |
            build/local-cache/ara
            art/characters/ara
          key: ara-underwear-${{ runner.os }}-${{ hashFiles('tools/build_ara_runtime_local.py', 'tools/ara/patch_layering.py', 'tools/character_definitions.py', 'data/items/item_definitions.json') }}
          restore-keys: |
            ara-underwear-${{ runner.os }}-

      - name: Cache accepted integrated female body
        uses: actions/cache@v4
        with:
          path: build/anatomy-review/female_average_claude_integrated.glb
          key: ara-female-integrated-${{ runner.os }}-${{ hashFiles('tools/blender/add_adult_anatomy_claude.py', 'tools/blender/add_adult_anatomy.py', 'tools/build_ara_runtime_local.py', 'tools/character_definitions.py') }}

      - name: Enable Corepack
        run: corepack enable

      - name: Build only the female underwear fit review
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: python tools/build_ara_runtime_local.py --underwear-review-only

      - name: Upload anatomy review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silverhart-average-body-anatomy-review
          path: build/anatomy-review/
          if-no-files-found: warn
          retention-days: 14
