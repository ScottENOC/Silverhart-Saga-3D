name: iPhone web preview

on:
  pull_request:
    branches: [dev]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "art/**"
      - "audio/**"
      - "data/**"
      - "shaders/**"
      - "tests/**"
      - "tools/deploy_web.py"
      - ".github/workflows/iphone-web-preview.yml"
  push:
    branches: [dev]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "art/**"
      - "audio/**"
      - "data/**"
      - "shaders/**"
      - "tests/**"
      - "tools/deploy_web.py"
      - ".github/workflows/iphone-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Godot 4.7.2 web export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project and build script class cache
        run: godot --headless --editor --path . --quit

      - name: Run hex-grid tests
        run: godot --headless --path . --script res://tests/test_hex_grid.gd

      - name: Run simulation tests
        run: godot --headless --path . --script res://tests/test_simulation.gd

      - name: Export web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
          find build/web -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .
          find build/web -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .

      - name: Create build manifest and publish to private Hugging Face Space
        env:
          HF_ADMIN_TOKEN: ${{ secrets.HF_ADMIN_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m pip install --disable-pip-version-check --quiet "huggingface_hub>=0.34"
          python tools/deploy_web.py --web-dir build/web

      - name: Keep web build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: silverhart-saga-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
