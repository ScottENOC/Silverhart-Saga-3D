name: Character pipeline validation

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/blender/**"
      - "tools/ara/**"
      - "tests/test_assemble_modular_glb.py"
      - ".github/workflows/**"
  push:
    branches: [dev]
    paths:
      - "tools/blender/**"
      - "tools/ara/**"
      - "tests/test_assemble_modular_glb.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-pipeline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    name: Validate character pipeline tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1
      - name: Compile Ara and Blender Python tools
        run: python -m compileall -q tools/blender tools/ara
      - name: Test modular GLB assembly
        run: python -m unittest discover -s tests -p 'test_assemble_modular_glb.py' -v
