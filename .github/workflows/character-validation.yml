name: Godot and Blender validation

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, feature/shared-character-system]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    name: Godot headless import and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and register global classes
        run: godot --headless --editor --path . --quit
      - name: Run hex-grid tests
        run: godot --headless --path . --script res://tests/test_hex_grid.gd
      - name: Run simulation tests
        run: godot --headless --path . --script res://tests/test_simulation.gd
      - name: Run character appearance tests
        run: godot --headless --path . --script res://tests/test_character_appearance.gd

  blender-python:
    name: Blender tool syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Blender Python scripts
        run: python -m compileall -q tools/blender
