name: Character pipeline validation

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/blender/**"
      - "tools/ara/**"
      - "tools/character_definitions.py"
      - "tools/build_ara_runtime_local.py"
      - "tools/ci/validate_character_definitions.py"
      - "data/characters/hollowmere_npcs.json"
      - "data/characters/body_profiles.json"
      - "data/items/item_definitions.json"
      - "tests/test_character_definitions.py"
      - "tests/test_assemble_modular_glb.py"
      - "data/characters/legacy_named_npcs.json"
      - "data/characters/legacy_enemy_roster.json"
      - "data/arena/arena_opponents.json"
      - "tools/ci/validate_legacy_character_rosters.py"
      - "tests/test_legacy_character_rosters.py"
      - ".github/workflows/**"
  push:
    branches: [dev]
    paths:
      - "tools/blender/**"
      - "tools/ara/**"
      - "tools/character_definitions.py"
      - "tools/ci/validate_character_definitions.py"
      - "data/characters/hollowmere_npcs.json"
      - "data/items/item_definitions.json"
      - "tests/test_character_definitions.py"
      - "tests/test_assemble_modular_glb.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-pipeline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    name: Validate character pipeline tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1
      - name: Compile Ara and Blender Python tools
        run: python -m compileall -q tools/character_definitions.py tools/build_ara_runtime_local.py tools/blender tools/ara
      - name: Validate ten canonical reusable body bases
        run: python tools/ara/validate_body_profiles.py
      - name: Validate canonical character inventory and equipment
        run: python tools/ci/validate_character_definitions.py
      - name: Test canonical character definitions
        run: python -m unittest discover -s tests -p "test_character_definitions.py" -v
      - name: Test modular GLB assembly
        run: python -m unittest discover -s tests -p 'test_assemble_modular_glb.py' -v
      - name: Validate complete legacy NPC, enemy and Arena rosters
        run: python -m unittest discover -s tests -p 'test_legacy_character_rosters.py' -v
