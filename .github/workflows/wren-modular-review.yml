name: Review Wren modular garments (latest build)

on:
  push:
    branches: [feature/wren-anatomy-piercings-halter-fit]
    paths:
      - ".github/workflows/wren-modular-review.yml"
      - ".github/workflows/wren-workshop.yml"
      - "tools/blender/**"
      - "tools/ara/**"
      - "site/index.html"

concurrency:
  group: wren-modular-review
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  review-modular-character:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact Workshop build revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and wait for the matching Ara Workshop build
        id: source-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/wren-workshop.yml/runs?branch=${GITHUB_REF_NAME}&per_page=50"
          source_run="$(gh api "$runs_url" --jq '.workflow_runs[0].id')"
          test -n "$source_run"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$source_run" --jq '.status')"
          while [ "$status" != "completed" ]; do
            sleep 20
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$source_run" --jq '.status')"
          done
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$source_run/artifacts" --jq '.artifacts[] | select(.name == "character-pipeline-evaluation" and .expired == false) | .name' | head -n 1)"
          test "$artifact" = "character-pipeline-evaluation"
          echo "run_id=$source_run" >> "$GITHUB_OUTPUT"

      - name: Download the generated character pipeline artifact
        uses: actions/download-artifact@v4
        with:
          name: character-pipeline-evaluation
          path: /tmp/ara-assets
          run-id: ${{ steps.source-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Blender for multi-angle garment review
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri

      - name: Render the actual modular character with all garments
        env:
          REVIEW_INPUT: /tmp/ara-assets/ara_person_modular.glb
          REVIEW_OUTPUT_DIR: review/modular
        run: |
          set -euo pipefail
          test -s "$REVIEW_INPUT"
          mkdir -p "$REVIEW_OUTPUT_DIR"
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless
          export LIBGL_ALWAYS_SOFTWARE=1
          blender --background --python-exit-code 1 --python tools/blender/inspect_character.py
          for view in front side rear three_quarter; do
            test -s "review/modular/$view.png"
          done

      - name: Upload modular clothing review renders
        uses: actions/upload-artifact@v4
        with:
          name: wren-modular-clothing-review
          path: review/modular/*.png
          if-no-files-found: error
          retention-days: 14
