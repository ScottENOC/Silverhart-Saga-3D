name: Review Wren modular garments (latest build)

on:
  push:
    branches: [integration/wren-modular-clothing]
    paths:
      - ".github/workflows/wren-modular-review.yml"
      - ".github/workflows/wren-workshop.yml"
      - "tools/blender/**"
      - "tools/ara/**"
      - "tools/review/**"
      - "site/index.html"

concurrency:
  group: wren-modular-review-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  review-modular-character:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact Workshop build revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and wait for the matching Ara Workshop build
        id: source-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/wren-workshop.yml/runs?branch=${GITHUB_REF_NAME}&per_page=50"
          source_run="$(gh api "$runs_url" --jq '.workflow_runs[0].id')"
          test -n "$source_run"
          while true; do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$source_run/artifacts" --jq '.artifacts[]? | select(.name == "character-pipeline-evaluation" and .expired == false) | .name' | head -n 1)"
            if [ "$artifact" = "character-pipeline-evaluation" ]; then
              break
            fi
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$source_run" --jq '.status')"
            if [ "$status" = "completed" ]; then
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$source_run" --jq '.conclusion')"
              echo "Workshop build ended ($conclusion) without the fitted character artifact" >&2
              exit 1
            fi
            sleep 20
          done
          echo "run_id=$source_run" >> "$GITHUB_OUTPUT"

      - name: Download the generated character pipeline artifact
        uses: actions/download-artifact@v4
        with:
          name: character-pipeline-evaluation
          path: /tmp/ara-assets
          run-id: ${{ steps.source-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Blender for multi-angle garment review
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri

      - name: Render isolated clothing combinations from the actual modular character
        run: |
          set -euo pipefail
          INPUT=/tmp/ara-assets/ara_person_modular.glb
          OUTPUT=review/outfits
          test -s "$INPUT"
          mkdir -p "$OUTPUT"
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless
          export LIBGL_ALWAYS_SOFTWARE=1
          blender --background --python-exit-code 1 --python tools/review/render_modular_outfits.py -- "$INPUT" "$OUTPUT"
          for outfit in skin halter dress pants halter_pants lace_briefs lace_shirt lace_pants; do
            for view in front side rear; do
              test -s "$OUTPUT/$outfit/$view.png"
            done
            test -s "$OUTPUT/$outfit/report.json"
          done

      - name: Build offline visual review gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          outfits = ["skin", "halter", "dress", "pants", "halter_pants", "lace_briefs", "lace_shirt", "lace_pants"]
          views = ["front", "side", "rear"]
          root = Path("review/outfits")
          cards = []
          for outfit in outfits:
              images = "".join(
                  f'<figure><img src="{outfit}/{view}.png" alt="{outfit} {view}"><figcaption>{view}</figcaption></figure>'
                  for view in views
              )
              cards.append(f'<section><h2>{outfit.replace("_", " ").title()}</h2><div class="views">{images}</div><p><a href="{outfit}/report.json">Material report</a></p></section>')
          html = """<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Wren clothing visual review</title><style>
          body{font:16px system-ui;margin:0 auto;padding:20px;max-width:1100px;background:#17191d;color:#eee}
          h1{font-size:1.5rem}h2{font-size:1.1rem;text-transform:capitalize}
          section{border-top:1px solid #555;padding:12px 0 22px}
          .views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
          figure{margin:0}img{display:block;width:100%;height:auto;background:#292d33}
          figcaption{font-size:.85rem;color:#bbb;text-align:center;padding:5px}
          a{color:#9cc9ff}@media(max-width:600px){body{padding:12px}.views{gap:5px}}
          </style><body><h1>Wren clothing visual review</h1>
          <p>Isolated renders of the same generated character. Compare front, side and rear; material reports are linked below each outfit.</p>
          """ + "".join(cards) + "</body></html>"
          (root / "index.html").write_text(html)
          PY
      - name: Upload isolated outfit review renders and material reports
        uses: actions/upload-artifact@v4
        with:
          name: wren-isolated-outfit-review
          path: review/outfits/**
          if-no-files-found: error
          retention-days: 14
