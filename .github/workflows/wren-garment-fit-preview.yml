name: Wren diagnostic garment fit preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wren-diagnostic-fit-preview
    paths:
      - "tools/blender/garment_fit/**"
      - ".github/workflows/wren-garment-fit-preview.yml"

permissions:
  actions: read
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download latest successful native Wren build from dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/wren-fit-preview
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$run_id" != "null"
          run_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.run_number')
          gh run download "$run_id" --name "wren-native-ara-$run_number" --dir build/wren-native
          test -s build/wren-native/Wren.glb
          echo "WREN_BUILD_RUN=$run_id" >> "$GITHUB_ENV"

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri

      - name: Generate fitted diagnostic shell and render views
        run: |
          set -euo pipefail
          blender --background --python-exit-code 1 --python tools/blender/garment_fit/render_wren_diagnostic_fit.py -- \
            --input build/wren-native/Wren.glb \
            --output-dir build/wren-fit-preview --clearance-mm 4

      - uses: actions/upload-artifact@v7
        with:
          name: wren-diagnostic-garment-fit-preview
          path: build/wren-fit-preview/
          if-no-files-found: error
          retention-days: 30
