name: Test new female anatomy on four companions

on:
  workflow_dispatch:
  push:
    branches:
      - feature/unified-female-anatomy-v2
    paths:
      - ".github/workflows/test-four-female-companions-anatomy-v2.yml"
      - "tools/blender/add_female_anatomy_surface.py"
      - "tools/blender/plan_female_anatomy_subdivision.py"
      - "character-preview/dagna-ara.json"
      - "character-preview/mirabel-ara.json"
      - "character-preview/reyna-ara.json"
      - "character-preview/wren-ara.json"

permissions:
  contents: read

concurrency:
  group: four-female-companions-anatomy-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Prepare Ara and Blender toolchain
        uses: ./.github/actions/character-build-setup

      - name: Validate source profiles and scripts
        run: |
          set -euo pipefail
          for name in dagna mirabel reyna wren; do
            python -m json.tool "character-preview/${name}-ara.json" >/dev/null
          done
          python -m py_compile \
            tools/blender/add_female_anatomy_surface.py \
            tools/blender/plan_female_anatomy_subdivision.py

      - name: Generate and apply new anatomy to the four female companions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          mkdir -p build/four-female-companions
          for name in dagna mirabel reyna wren; do
            echo "::group::Building ${name}"
            root="build/four-female-companions/${name}"
            mkdir -p "${root}/ara-export"
            python - "${name}" <<'PY'
          import json, sys
          from pathlib import Path
          name = sys.argv[1]
          source = Path(f"character-preview/{name}-ara.json")
          profile = json.loads(source.read_text())
          profile.pop("character_details", None)
          params = profile.setdefault("params", {})
          # Character-detail metadata is handled separately from the anatomy test.
          params.pop("tattoo_ink", None)
          params.pop("piercings", None)
          Path(f"build/four-female-companions/{name}/ara-profile.json").write_text(
              json.dumps(profile, indent=2)
          )
          PY
            npx --yes ara3d@0.7.4 export \
              --params "${root}/ara-profile.json" \
              --detail high --no-animations --formats glb \
              --out "${root}/ara-export"
            raw_glb="$(find "${root}/ara-export" -maxdepth 1 -type f -name '*.glb' -print -quit)"
            test -n "${raw_glb}"
            test -s "${raw_glb}"
            cp "${raw_glb}" "${root}/${name}-ara-raw.glb"

            # Each character gets a plan derived from its own exact source topology.
            blender --background --python-exit-code 1 \
              --python tools/blender/plan_female_anatomy_subdivision.py -- \
              --input "${root}/${name}-ara-raw.glb" \
              --output "${root}/subdivision-plan.json"
            test -s "${root}/subdivision-plan.json"

            blender --background --python-exit-code 1 \
              --python tools/blender/add_female_anatomy_surface.py -- \
              --input "${root}/${name}-ara-raw.glb" \
              --output "${root}/${name}-anatomy-v2.glb" \
              --report "${root}/anatomy-report.json" \
              --subdivision-plan "${root}/subdivision-plan.json" \
              --adult --deformation-scale 1.65
            test -s "${root}/${name}-anatomy-v2.glb"
            python - "${root}/anatomy-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["exported_nonwhite_colour_vertices"] > 0, report
          assert report["anatomy_pigmented_vertex_count"] > 0, report
          assert report["clothing_operations"] == "not run", report
          print(json.dumps({
              "skin_vertices": report["skin_vertices"],
              "exported_nonwhite_colour_vertices": report["exported_nonwhite_colour_vertices"],
              "anatomy_pigmented_vertex_count": report["anatomy_pigmented_vertex_count"],
              "height_metres": report["height_metres"]
          }, indent=2))
          PY
            echo "::endgroup::"
          done

      - name: Upload four anatomy test models and reports
        uses: actions/upload-artifact@v4
        with:
          name: four-female-companions-anatomy-v2-${{ github.run_number }}
          path: |
            build/four-female-companions/*/*-anatomy-v2.glb
            build/four-female-companions/*/anatomy-report.json
            build/four-female-companions/*/subdivision-plan.json
            build/four-female-companions/*/ara-profile.json
          if-no-files-found: error
          retention-days: 30
