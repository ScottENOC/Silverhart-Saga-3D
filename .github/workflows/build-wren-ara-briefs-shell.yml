name: Build Ara body-derived briefs and bra on Wren

on:
  push:
    branches: [feature/body-derived-garment-shell]
    paths:
      - "tools/blender/garment_shell/**"
      - ".github/workflows/build-wren-ara-briefs-shell.yml"
  pull_request:
    branches: [dev]
    paths:
      - "tools/blender/garment_shell/**"
      - ".github/workflows/build-wren-ara-briefs-shell.yml"
  workflow_dispatch:

concurrency:
  group: wren-ara-garments-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  briefs:
    name: Build and publish briefs independently
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Install Blender and numerical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri aria2
      - name: Download latest successful native Ara Wren build from dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/wren-briefs-shell
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$run_id" != "null"
          run_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.run_number')
          gh run download "$run_id" --name "wren-native-ara-$run_number" --dir build/wren-native
          test -s build/wren-native/Wren.glb
      - name: Compile tools and test shell geometry
        run: |
          set -euo pipefail
          python3 -m py_compile tools/blender/garment_shell/*.py
          python3 -m unittest discover -s tools/blender/garment_shell -p 'test_*.py' -v
      - name: Reconstruct Ara standard-briefs coverage
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-exit-code 1 --python tools/blender/garment_shell/build_ara_briefs_field.py -- \
            --input build/wren-native/Wren.glb \
            --output build/wren-briefs-shell/ara-briefs-field.json \
            --report build/wren-briefs-shell/coverage-report.json
          test -s build/wren-briefs-shell/ara-briefs-field.json
          test -s build/wren-briefs-shell/coverage-report.json
      - name: Construct and skin briefs from Wren's body surface
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-exit-code 1 --python tools/blender/garment_shell/build_shell_from_body.py -- \
            --input build/wren-native/Wren.glb \
            --field-json build/wren-briefs-shell/ara-briefs-field.json \
            --output build/wren-briefs-shell/Wren_Ara_Briefs.glb \
            --review-output build/wren-briefs-shell/Wren_Ara_Briefs_Review.glb \
            --material-name Briefs --fabric-profile black_matte_moderate_stretch \
            --colour 0.008 0.008 0.010 1.0 --offset-m 0.003 --hem-depth-m 0.0015
          test -s build/wren-briefs-shell/Wren_Ara_Briefs.glb
          test -s build/wren-briefs-shell/Wren_Ara_Briefs_Review.glb
          test -s build/wren-briefs-shell/Wren_Ara_Briefs.report.json
      - name: Render briefs front, side and rear
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          blender --background --python-exit-code 1 --python tools/blender/garment_shell/render_wren_briefs_shell.py -- \
            build/wren-native/Wren.glb build/wren-briefs-shell/Wren_Ara_Briefs.glb build/wren-briefs-shell/review
          for view in front side rear; do test -s "build/wren-briefs-shell/review/$view.png"; done
          test -s build/wren-briefs-shell/review/review-report.json
      - name: Upload briefs GLBs and diagnostics immediately
        uses: actions/upload-artifact@v7
        with:
          name: wren-ara-body-derived-briefs
          path: build/wren-briefs-shell/
          if-no-files-found: error
          retention-days: 30

  bra:
    name: Build and publish bra independently
    needs: briefs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Install Blender and numerical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Download latest successful native Ara Wren build from dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/wren-bra
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$run_id" != "null"
          run_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.run_number')
          gh run download "$run_id" --name "wren-native-ara-$run_number" --dir build/wren-native
          test -s build/wren-native/Wren.glb
      - name: Checkout pinned Ara generator
        run: |
          git clone https://github.com/olatunde85/3d-gen.git /tmp/ara-3d-gen
          git -C /tmp/ara-3d-gen checkout b60b5bece6d383d2cbb7067fd50e7c8e68b5a395
      - name: Install generator dependencies
        run: |
          corepack enable
          cd /tmp/ara-3d-gen
          pnpm install --no-frozen-lockfile
      - name: Restore cached MakeHuman source and system assets
        id: makehuman-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ara-3d-gen/vendor/mh
            /tmp/ara-3d-gen/vendor/sys
            /tmp/ara-3d-gen/vendor/dl
            /tmp/ara-3d-gen/vendor/mocap/cmu
            /tmp/ara-3d-gen/public/assets
          key: ara-makehuman-assets-b60b5bece6d383d2cbb7067fd50e7c8e68b5a395-v3
      - name: Download MakeHuman assets (cache miss only)
        if: steps.makehuman-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd /tmp/ara-3d-gen
          sed -i 's#https://files.makehumancommunity.org/asset_packs/#https://files2.makehumancommunity.org/asset_packs/#' scripts/setup-assets.ts
          # Fetch the large system-asset archive with parallel connections. Keep it at
          # the path setup-assets.ts expects so its own size check reuses the file.
          mkdir -p vendor/dl
          if [ ! -s vendor/dl/sys.zip ]; then
            aria2c --continue=true --allow-overwrite=true --auto-file-renaming=false \
              --file-allocation=none --max-connection-per-server=16 --split=16 \
              --min-split-size=1M --summary-interval=30 \
              --dir vendor/dl --out sys.zip \
              https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip
          fi
          npm run setup-assets
          test -d vendor/mh
          test -d vendor/sys
      - name: Generate standard Ara bra source
        shell: bash
        run: |
          set -euo pipefail
          # patch_layering.py edits the pinned generator's src/ tree; run it
          # from that checkout rather than the Silverhart workspace.
          cd /tmp/ara-3d-gen
          python "$GITHUB_WORKSPACE/tools/ara/patch_layering.py"
          python - <<'PY'
          import json
          from pathlib import Path
          params = {
              "seed": 218, "gender": 0, "age": 0.5, "muscle": 0.5,
              "weight": 0.5, "height": 0.5, "proportions": 0.5,
              "african": 0.05, "asian": 0.05, "caucasian": 0.9,
              "breastSize": 0.5, "breastFirmness": 0.55,
              "hair": "short02", "hairTint": "#49372a",
              "outfit": "none", "top": "none", "underTop": "bra",
              "underBottom": "none", "jacket": "none", "bottom": "none",
              "underwear": False, "shoes": "none", "hat": "none",
              "weapon": "none", "carry": "none", "accessories": [],
              "detail": "high", "rig": "game", "restPose": "A",
              "animations": True, "faceBones": True, "faceShapes": True,
              "speechShapes": False, "expression": "neutral",
              "name": "Ara standard bra reference"
          }
          Path("/tmp/ara-bra-params.json").write_text(json.dumps(params, indent=2) + "\n")
          PY
          mkdir -p /tmp/ara-bra-export
          cd /tmp/ara-3d-gen
          npm run export -- --params /tmp/ara-bra-params.json --detail high --formats glb --out /tmp/ara-bra-export
          source_zip="$(find /tmp/ara-bra-export -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$source_zip"
          source_entry="$(unzip -Z1 "$source_zip" | grep -E '\.glb$' | head -n 1)"
          test -n "$source_entry"
          unzip -p "$source_zip" "$source_entry" > /tmp/ara-standard-bra-source.glb
          test -s /tmp/ara-standard-bra-source.glb
      - name: Fit bra to Wren and apply shared opaque fabric
        run: |
          set -euo pipefail
          python tools/ara/extract_garment_glb.py --body build/wren-native/Wren.glb \
            --source /tmp/ara-standard-bra-source.glb --selector "Bra" \
            --output build/wren-bra/Wren_Ara_Bra_assembled.glb
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python-exit-code 1 --python tools/blender/garment_shell/build_ara_bra_review.py -- \
            --input build/wren-bra/Wren_Ara_Bra_assembled.glb \
            --garment-output build/wren-bra/Wren_Ara_Bra.glb \
            --review-output build/wren-bra/Wren_Ara_Bra_Review.glb --clearance-m 0.0045
          test -s build/wren-bra/Wren_Ara_Bra.glb
          test -s build/wren-bra/Wren_Ara_Bra_Review.glb
          test -s build/wren-bra/Wren_Ara_Bra.report.json
      - name: Render bra front, side and rear
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          blender --background --python-exit-code 1 --python tools/blender/garment_shell/render_wren_briefs_shell.py -- \
            build/wren-native/Wren.glb build/wren-bra/Wren_Ara_Bra.glb build/wren-bra/review
          for view in front side rear; do test -s "build/wren-bra/review/$view.png"; done
      - name: Upload bra GLBs and diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: wren-ara-body-derived-bra
          path: build/wren-bra/
          if-no-files-found: error
          retention-days: 30
