name: Compare Ara-native briefs and bra with Wren rig transfer

on:
  push:
    branches: [diagnostic/ara-native-garment-baseline-20261125]
    paths:
      - ".github/workflows/ara-native-garment-baseline.yml"
      - "tools/blender/garment_shell/render_wren_briefs_shell.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Download latest successful native Wren build from dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/garment-baseline
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$run_id" != "null"
          run_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.run_number')
          gh run download "$run_id" --name "wren-native-ara-$run_number" --dir build/wren-native
          test -s build/wren-native/Wren.glb
          echo "WREN_BUILD_RUN=$run_id" >> "$GITHUB_ENV"
          echo "WREN_BUILD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.head_sha')" >> "$GITHUB_ENV"

      - name: Validate Ara source assets and scripts
        run: |
          set -euo pipefail
          test -s art/characters/ara_runtime/ara_person_body_anatomy.glb
          test -s art/characters/ara_runtime/ara_person_benchmark.glb
          test -s art/characters/ara_runtime/ara_person_modular_underwear.glb
          python -m py_compile tools/ara/assemble_modular_glb.py tools/ara/extract_garment_glb.py tools/blender/add_adult_anatomy.py tools/blender/garment_shell/render_wren_briefs_shell.py

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri

      - name: Assemble untouched Ara briefs and bra on Ara's native body
        run: |
          set -euo pipefail
          python tools/ara/assemble_modular_glb.py \
            art/characters/ara_runtime/ara_person_body_anatomy.glb \
            build/garment-baseline/ara-garments-before-fit.glb \
            art/characters/ara_runtime/ara_person_benchmark.glb "Briefs" \
            art/characters/ara_runtime/ara_person_benchmark.glb "Bra"
          test -s build/garment-baseline/ara-garments-before-fit.glb

      - name: Apply Ara's own existing-garment fitting mechanism on Ara
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          blender --background --python-exit-code 1 \
            --python tools/blender/add_adult_anatomy.py -- \
            --input build/garment-baseline/ara-garments-before-fit.glb \
            --output build/garment-baseline/ara-garments-native-fit.glb \
            --profile none --adult --fit-existing
          test -s build/garment-baseline/ara-garments-native-fit.glb

      - name: Extract the Ara-fitted briefs and bra without changing their geometry
        run: |
          set -euo pipefail
          python tools/ara/extract_garment_glb.py \
            --strip-input build/garment-baseline/ara-garments-native-fit.glb \
            --keep-material Briefs \
            --output build/garment-baseline/ara-native-briefs.glb
          python tools/ara/extract_garment_glb.py \
            --strip-input build/garment-baseline/ara-garments-native-fit.glb \
            --keep-material Bra \
            --output build/garment-baseline/ara-native-bra.glb
          test -s build/garment-baseline/ara-native-briefs.glb
          test -s build/garment-baseline/ara-native-bra.glb

      - name: Transfer those exact fitted garments to Wren's rig, without a second fit
        run: |
          set -euo pipefail
          python tools/ara/assemble_modular_glb.py \
            build/wren-native/Wren.glb \
            build/garment-baseline/wren-briefs-direct-transfer.glb \
            build/garment-baseline/ara-native-briefs.glb "Briefs"
          python tools/ara/assemble_modular_glb.py \
            build/wren-native/Wren.glb \
            build/garment-baseline/wren-bra-direct-transfer.glb \
            build/garment-baseline/ara-native-bra.glb "Bra"
          test -s build/garment-baseline/wren-briefs-direct-transfer.glb
          test -s build/garment-baseline/wren-bra-direct-transfer.glb

      - name: Render Ara-native fit and exact Wren transfers
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1
          for item in briefs bra; do
            case "$item" in
              briefs) material=Briefs; ara=ara-native-briefs.glb; wren=wren-briefs-direct-transfer.glb ;;
              bra) material=Bra; ara=ara-native-bra.glb; wren=wren-bra-direct-transfer.glb ;;
            esac
            blender --background --python-exit-code 1 \
              --python tools/blender/garment_shell/render_wren_briefs_shell.py -- \
              art/characters/ara_runtime/ara_person_body_anatomy.glb \
              "build/garment-baseline/$ara" "build/garment-baseline/review/ara-$item"
            blender --background --python-exit-code 1 \
              --python tools/blender/garment_shell/render_wren_briefs_shell.py -- \
              build/wren-native/Wren.glb \
              "build/garment-baseline/$wren" "build/garment-baseline/review/wren-$item"
          done
          for image in \
            build/garment-baseline/review/ara-briefs/front.png \
            build/garment-baseline/review/ara-briefs/side.png \
            build/garment-baseline/review/ara-bra/front.png \
            build/garment-baseline/review/wren-briefs/front.png \
            build/garment-baseline/review/wren-bra/front.png; do
            test -s "$image"
          done

      - name: Upload source GLBs and comparison renders
        uses: actions/upload-artifact@v7
        with:
          name: ara-native-garment-baseline
          path: build/garment-baseline/
          if-no-files-found: error
          retention-days: 30
