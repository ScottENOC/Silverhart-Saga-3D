name: Capture Hollowmere map screenshots

on:
  push:
    branches: [feature/opening-village]
    paths:
      - "scripts/world/**"
      - "scenes/**"
      - "tests/capture_hollowmere_overview.gd"
      - ".github/workflows/hollowmere-screenshots.yml"
  pull_request:
    branches: [feature/male-anatomy-skinned-mesh]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hollowmere-screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  capture:
    name: Render village overview and three-quarter views
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Install virtual display and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1
      - name: Locate latest successful Hollowmere NPC build
        id: hollowmere-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow .github/workflows/hollowmere-npcs.yml --branch feature/opening-village --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download Hollowmere Ara model pack
        uses: actions/download-artifact@v4
        with:
          name: hollowmere-npc-models
          run-id: ${{ steps.hollowmere-build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/hollowmere-npc-models
      - name: Restore Ara NPC models into the Godot project
        run: |
          set -euo pipefail
          mkdir -p art/characters/hollowmere
          cp /tmp/hollowmere-npc-models/*.glb art/characters/hollowmere/
          cp /tmp/hollowmere-npc-models/*.params.json art/characters/hollowmere/
          cp /tmp/hollowmere-npc-models/profiles.json art/characters/hollowmere/
      - name: Import project and Ara characters
        run: godot --headless --editor --path . --quit
      - name: Capture Hollowmere screenshots
        run: xvfb-run -a godot --path . --rendering-driver opengl3 --script res://tests/capture_hollowmere_overview.gd
      - name: Upload map screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hollowmere-map-screenshots
          path: art/review/*.png
          if-no-files-found: error
          retention-days: 14
