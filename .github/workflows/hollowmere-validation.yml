name: Hollowmere village validation

on:
  push:
    branches: [dev, feature/opening-village]
    paths:
      - "scripts/world/**"
      - "scripts/presentation/ara_character_actor.gd"
      - "data/characters/hollowmere_npcs.json"
      - "tests/test_hollowmere_village.gd"
      - ".github/workflows/hollowmere-validation.yml"
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hollowmere-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  godot:
    name: Import and test Hollowmere
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and register global classes
        run: godot --headless --editor --path . --quit
      - name: Run hex-grid tests
        run: godot --headless --path . --script res://tests/test_hex_grid.gd
      - name: Run simulation tests
        run: godot --headless --path . --script res://tests/test_simulation.gd
      - name: Run character appearance tests
        run: godot --headless --path . --script res://tests/test_character_appearance.gd
      - name: Run Hollowmere map and profile tests
        run: godot --headless --path . --script res://tests/test_hollowmere_village.gd
      - name: Launch the opening village scene
        run: godot --headless --path . --quit-after 10

  python:
    name: Validate Ara build tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Ara profile exporter
        run: python -m py_compile tools/ara/build_hollowmere_npcs.py
      - name: Validate Hollowmere profile JSON
        run: python -m json.tool data/characters/hollowmere_npcs.json > /dev/null
