name: Spellcasting validation

on:
  pull_request:
    branches: [dev, dev_2, "feature/**"]
    paths:
      - "scripts/simulation/**"
      - "data/magic/**"
      - "tests/test_spell*.gd"
      - "tests/test_all_spell_effects.gd"
      - "tests/test_combat_and_reactions.gd"
      - ".github/workflows/spellcasting-validation.yml"

permissions:
  contents: read

concurrency:
  group: spellcasting-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcasting:
    name: Godot 4.7.2 spellcasting tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Run spell construction and cost rules tests
        run: godot --headless --path . --script res://tests/test_spell_rules.gd
      - name: Run shared player and NPC casting tests
        run: godot --headless --path . --script res://tests/test_spell_casting.gd
      - name: Run all 15 spell effect tests
        run: godot --headless --path . --script res://tests/test_all_spell_effects.gd
      - name: Run combat and reaction regression tests
        run: godot --headless --path . --script res://tests/test_combat_and_reactions.gd
