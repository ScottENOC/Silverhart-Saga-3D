name: Godot validation

on:
  pull_request:
    branches: [dev, dev_2, "feature/**"]
    paths:
      - "project.godot"
      - "docs/SHARED_CHARACTER_ANATOMY.md"
      - "export_presets.cfg"
      - "art/characters/**"
      - "art/ui/**"
      - "art/environment/**"
      - "art/creatures/**"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - "tools/ci/**"
      - "tools/garment_guide_curve_editor.gd"
      - "tools/surface_landmark_editor.gd"
      - "tools/surface_landmark_editor.tscn"
      - "tools/surface_contact_path_editor.gd"
      - "tools/surface_contact_path_editor.tscn"
      - "tests/test_surface_contact_path_editor_load.gd"
      - "tools/garment_guide_curve_editor.tscn"
      - "tools/review/capture_garment_guide_editor.gd"
      - "tools/review/ara_contact_path_review.gd"
      - "tools/review/ara_anatomy_region_review.gd"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [dev, dev_2, "feature/**"]
    paths:
      - "project.godot"
      - "docs/SHARED_CHARACTER_ANATOMY.md"
      - "export_presets.cfg"
      - "art/characters/**"
      - "art/ui/**"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - "tools/garment_guide_curve_editor.gd"
      - "tools/surface_landmark_editor.gd"
      - "tools/surface_landmark_editor.tscn"
      - "tools/garment_guide_curve_editor.tscn"
      - "tools/review/capture_garment_guide_editor.gd"
      - "tools/review/ara_contact_path_review.gd"
      - ".github/workflows/ara-contact-path-visual-review.yml"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or commit SHA to validate"
        required: true
        default: "dev"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-tests:
    name: Godot 4.7.2 headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - name: Fetch current native Wren and Aldric builds for anatomy validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/aldric-native
          wren_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          aldric_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-aldric-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$wren_run" != "null" && test "$aldric_run" != "null"
          wren_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$wren_run" --jq '.run_number')
          aldric_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$aldric_run" --jq '.run_number')
          gh run download "$wren_run" --name "wren-native-ara-$wren_number" --dir build/wren-download
          gh run download "$aldric_run" --name "aldric-native-ara-$aldric_number" --dir build/aldric-download
          cp build/wren-download/Wren.glb build/wren-native/Wren.glb
          cp build/aldric-download/Aldric.glb build/aldric-native/Aldric.glb
          test -s build/wren-native/Wren.glb
          test -s build/aldric-native/Aldric.glb
      - name: Fetch verified Kenney Nature Kit models
        run: python tools/ci/fetch_kenney_nature_assets.py
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Verify engine version and import project
        run: |
          godot --version
          godot --headless --editor --path . --quit
      - name: Run body pressure solver regression test
        run: godot --headless --path . --script res://tests/test_body_pressure_solver.gd
      - name: Run body pressure controller regression test
        run: godot --headless --path . --script res://tests/test_body_pressure_controller.gd
      - name: Run body pressure contact regression test
        run: godot --headless --path . --script res://tests/test_body_pressure_contact.gd
      - name: Run canonical anatomy pressure profile regression test
        run: godot --headless --path . --script res://tests/test_body_pressure_profile_library.gd
      - name: Test MakeHuman target parser
        run: |
          python -m py_compile tools/makehuman/target_format.py
          python -m unittest discover -s tests -p test_makehuman_target_format.py
      - name: Run hex-grid tests
        run: godot --headless --path . --script res://tests/test_hex_grid.gd
      - name: Run split character and progression tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_character_systems.gd
      - name: Run spell construction and cost rules tests
        run: godot --headless --path . --script res://tests/test_spell_rules.gd
      - name: Run shared spell casting and combat AI tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_spell_casting.gd
      - name: Run spell effect tests
        run: timeout 120s bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_all_spell_effects.gd
      - name: Run spell visual effect tests
        run: timeout 120s bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_spell_vfx.gd
      - name: Run skill purchase and persistence tests
        run: godot --headless --path . --script res://tests/test_skill_progression_ui.gd
      - name: Run player and companion skill tree UI tests
        run: godot --headless --path . --script res://tests/test_skill_tree_panel.gd
      - name: Run split campaign content tests
        run: godot --headless --path . --script res://tests/test_campaign_content.gd
      - name: Run split items and equipment tests
        run: godot --headless --path . --script res://tests/test_items_and_equipment.gd
      - name: Run split world and movement tests
        run: godot --headless --path . --script res://tests/test_world_movement.gd
      - name: Run split combat and reaction tests
        run: godot --headless --path . --script res://tests/test_combat_and_reactions.gd
      - name: Run split animal and riding tests
        run: godot --headless --path . --script res://tests/test_animals_and_riding.gd
      - name: Run reusable building and door tests
        run: godot --headless --path . --script res://tests/test_building_framework.gd
      # Keep presentation-component tests isolated from campaign simulation suites.
      - name: Run campaign UI tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_campaign_ui.gd
      - name: Run SaveManager round-trip tests
        run: godot --headless --path . --script res://tests/test_save_manager.gd
      - name: Diagnose direct HollowTankard script load
        run: godot --headless --path . --script res://tests/diagnose_tavern_script_load.gd
      - name: Run campaign save/restore scene integration tests
        run: timeout 180s godot --headless --path . res://tests/save_restore_boot.tscn
      - name: Run NPC pass-through tests
        run: godot --headless --path . --script res://tests/test_npc_pass_through.gd
      - name: Run shared character anatomy tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_character_anatomy.gd
      - name: Validate anatomy landmarks on both canonical Ara bodies
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_ara_body_anatomy_assets.gd
      - name: Audit deformation-ready Ara surface channels
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/audit_ara_surface_channels.gd
      - name: Test deformation-aware Ara surface regions
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 bash tools/ci/run_godot_checked.sh godot --path . --rendering-method gl_compatibility --script res://tests/test_character_surface_regions.gd
      - name: Test authored fine Wren and Aldric surface mask contract
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_character_surface_region_masks.gd
      - name: Test topology-bound Ara garment guide curves
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_character_garment_guide_curves.gd
      - name: Test topology-bound semantic Ara surface landmarks
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_character_surface_landmarks.gd
      - name: Load Ara surface landmark editor
        run: timeout 120s bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_surface_landmark_editor_load.gd
      - name: Load Ara surface contact path editor
        run: timeout 120s bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_surface_contact_path_editor_load.gd
      - name: Load Ara garment guide curve editor
        run: timeout 120s bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_garment_guide_curve_editor_load.gd
      - name: Load Wren/Aldric anatomy surface painter tool
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_anatomy_surface_painter_load.gd
      - name: Audit fine Ara anatomy surface geometry
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/audit_ara_fine_surface_geometry.gd
      - name: Run character appearance tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_character_appearance.gd
      - name: Run equipment appearance and heraldry tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_equipment_appearance.gd
      - name: Run seasonal tree tests
        run: godot --headless --path . --script res://tests/test_seasonal_trees.gd
      - name: Run wilderness resource visual tests
        run: godot --headless --path . --script res://tests/test_wilderness_resource_visuals.gd
      - name: Run farm wolf quest and creature asset tests
        run: godot --headless --path . --script res://tests/test_farm_wolves_quest.gd
      - name: Run Hollowmere map and character profile tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_hollowmere_village.gd
      - name: Run Campaign 2 road manifest tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_campaign2_road_paths.gd
      - name: Run Campaign 2 geography manifest tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_campaign2_geography_manifest.gd
      - name: Run Campaign 2 world terrain tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_campaign2_world_terrain.gd
      - name: Run Campaign 2 settlement layout tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_campaign2_settlement_layouts.gd
      - name: Validate Hollowmere and item data JSON
        run: |
          python -m json.tool data/characters/hollowmere_npcs.json > /dev/null
          python -m json.tool data/world/hollowmere_population.json > /dev/null
          python -m json.tool data/characters/hollowmere_loadouts.json > /dev/null
          python -m json.tool data/characters/character_creation_rules.json > /dev/null
          python -m json.tool data/items/item_definitions.json > /dev/null
          python -m json.tool data/world/campaign2_geography.json > /dev/null
          python -m json.tool data/world/campaign2_road_paths.json > /dev/null
          python -m json.tool data/world/campaign2_settlement_layouts.json > /dev/null
          python -m json.tool data/characters/campaign2_characters.json > /dev/null
      - name: Smoke-test terrain prototype
        run: godot --headless --path . --scene res://scenes/prototypes/terrain_elevation_prototype.tscn --quit-after 5
      - name: Smoke-test Campaign 2 macro-world preview
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --scene res://scenes/prototypes/campaign2_macro_world_preview.tscn --quit-after 5
      - name: Smoke-test Campaign 2 regional streamed world
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --scene res://scenes/prototypes/campaign2_regional_world_preview.tscn --quit-after 10
      - name: Smoke-test campaign character creation and opening scene
        run: godot --headless --path . --scene res://scenes/main.tscn --quit-after 10
      - name: Smoke-test opening village
        run: godot --headless --path . --quit-after 10
      - name: Render current Wren and Aldric surface-path review images
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1400x1300x24" godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tools/review/ara_contact_path_review.gd
          for character in wren aldric; do
            for view in front side rear; do
              test -s "build/ara-contact-path-review/$character/$view.png"
            done
            test -s "build/ara-contact-path-review/$character/report.json"
          done
      - name: Render broad Wren and Aldric torso region overlays
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1400x1300x24" godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tools/review/ara_anatomy_region_review.gd
          for character in wren aldric; do
            for view in front side rear; do
              test -s "build/ara-anatomy-region-review/$character/$view.png"
            done
            test -s "build/ara-anatomy-region-review/$character/report.json"
          done

      - name: Upload Wren and Aldric anatomical region colour review
        uses: actions/upload-artifact@v7
        with:
          name: wren-aldric-anatomical-region-colour-review
          path: build/ara-anatomy-region-review/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Wren and Aldric visual review
        uses: actions/upload-artifact@v7
        with:
          name: wren-aldric-native-mesh-visual-review
          path: build/ara-contact-path-review/
          if-no-files-found: error
          retention-days: 30

