name: Godot validation

on:
  pull_request:
    branches: [dev, feature/port-action-economy, feature/terrain-character-grounding-test, feature/ara-skeleton-animation-validation]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [dev, feature/port-action-economy, feature/terrain-character-grounding-test, feature/ara-skeleton-animation-validation, feature/ara-visual-animation-review]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-tests:
    name: Godot 4.7.2 headless tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify engine version
        run: godot --version

      # Fetch the exact Wren Ara export set used by the character pipeline.
      - name: Download Wren Workshop character export
        uses: actions/download-artifact@v4
        with:
          name: character-pipeline-evaluation
          repository: ${{ github.repository }}
          run-id: 41979224139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/wren-character-assets

      - name: Stage Wren Workshop character assets
        run: |
          set -euo pipefail
          mkdir -p art/characters/wren art/characters/ara_validation/modular
          cp /tmp/wren-character-assets/ara_wren_mobile.glb art/characters/wren/ara_wren_mobile.glb
          cp /tmp/wren-character-assets/ara_wren_benchmark.glb art/characters/ara_validation/ara_wren_benchmark.glb
          for component in body hair shirt trousers; do
            cp "/tmp/wren-character-assets/modular/${component}.glb" "art/characters/ara_validation/modular/${component}.glb"
          done
          cp /tmp/wren-character-assets/npcs/npc_female_slim/boots.glb art/characters/ara_validation/boots.glb
          cp /tmp/wren-character-assets/npcs/npc_female_slim/weapon_sword.glb art/characters/ara_validation/weapon_sword.glb

      - name: Import project and build global script class cache
        run: godot --headless --editor --path . --quit

      - name: Run Ara skeleton and animation integration test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_ara_animation_import.gd 2>&1 | tee /tmp/ara-animation-test.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to instantiate' /tmp/ara-animation-test.log; then
            echo "Godot reported an import or script error in the Ara animation test."
            exit 1
          fi
          grep -q 'ARA_ANIMATION_INTEGRATION_TEST: PASS' /tmp/ara-animation-test.log

      - name: Run hex-grid tests
        run: godot --headless --path . --script res://tests/test_hex_grid.gd

      - name: Run simulation and movement tests
        run: godot --headless --path . --script res://tests/test_simulation.gd

      - name: Smoke-test the terrain prototype scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --scene res://scenes/prototypes/terrain_elevation_prototype.tscn --quit-after 5 2>&1 | tee /tmp/terrain-prototype.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to instantiate' /tmp/terrain-prototype.log; then
            echo "Godot reported a script or resource load error while starting the terrain prototype."
            exit 1
          fi

      - name: Capture terrain prototype screenshots
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/capture_terrain_prototype.gd 2>&1 | tee /tmp/terrain-capture.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to instantiate' /tmp/terrain-capture.log; then
            echo "Godot reported an error while capturing terrain screenshots."
            exit 1
          fi
          test -s artifacts/terrain-overview.png
          test -s artifacts/terrain-overhead.png
          test -s artifacts/terrain-ridge-oblique.png
          test -s artifacts/terrain-character-grounding.png

      - name: Capture Ara modular character animations
        shell: bash
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/capture_ara_modular_animations.gd 2>&1 | tee /tmp/ara-visual-capture.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to instantiate' /tmp/ara-visual-capture.log; then
            echo "Godot reported an error while capturing Ara animation poses."
            exit 1
          fi
          grep -q 'ARA_VISUAL_ANIMATION_CAPTURE: PASS' /tmp/ara-visual-capture.log
          test -s artifacts/ara-animation/ara-wren-idle.png
          test -s artifacts/ara-animation/ara-wren-walk.png
          test -s artifacts/ara-animation/ara-wren-run.png
          test -s artifacts/ara-animation/ara-wren-strafe-left.png
          test -s artifacts/ara-animation/ara-wren-turn-left.png
          test -s artifacts/ara-animation/ara-wren-jump.png
          test -s artifacts/ara-animation/ara-wren-sword-slash.png

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-and-ara-animation-screenshots
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
