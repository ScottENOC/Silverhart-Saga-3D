name: Godot validation
# Full validation is intentionally triggered on the reconciled terrain-chain head.

on:
  pull_request:
    branches: [dev, dev_2, "feature/**"]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "**/*.json"
      - ".editorconfig"
      - "project.godot"
      - "export_presets.cfg"
      - "art/characters/**"
      - "art/ui/**"
      - "art/environment/**"
      - "art/creatures/**"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - "tools/ci/**"
      - ".github/workflows/godot-validation.yml"
  push:
    branches: [dev, dev_2, "feature/**"]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "art/characters/**"
      - "art/ui/**"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or commit SHA to validate"
        required: true
        default: "dev"
        type: string

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-tests:
    name: Godot 4.7.2 headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          fetch-depth: 0
      - name: Check changed GDScript files only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CHECK_SHA" -- '*.gd')
          if [ "${#changed[@]}" -gt 0 ]; then
            python tools/ci/check_gdscript_indentation.py "${changed[@]}"
          else
            echo "No changed GDScript files to check."
          fi
      - name: Fetch verified Kenney Nature Kit models
        run: python tools/ci/fetch_kenney_nature_assets.py
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Verify engine version and import project
        run: |
          godot --version
          godot --headless --editor --path . --quit
      - name: Run simulation encounter service tests
        run: godot --headless --path . --script res://tests/test_combat_encounter_service.gd
      - name: Run player body asset import regression test when generated assets are present
        if: ${{ hashFiles('art/characters/ara_runtime/ara_player_female_body.glb', 'art/characters/ara_runtime/ara_player_male_body.glb') != '' }}
        run: godot --headless --path . --script res://tests/test_player_body_assets.gd
      - name: Run Ara hair retargeting regression test when hair assets are present
        if: ${{ hashFiles('art/characters/ara_runtime/hair/manifest.json') != '' }}
        run: godot --headless --path . --script res://tests/test_ara_hair_assets.gd
      - name: Test campaign character model asset resolution when all model packs are installed
        if: ${{ hashFiles('art/characters/companions/wren.glb') != '' && hashFiles('art/characters/companions/aldric.glb') != '' && hashFiles('art/characters/companions/dagna.glb') != '' && hashFiles('art/characters/hollowmere/garrick_holt.glb') != '' && hashFiles('art/characters/hollowmere/mira_ashbrook.glb') != '' && hashFiles('art/characters/ara_runtime/ara_player_female_body.glb') != '' && hashFiles('art/characters/ara_runtime/ara_player_male_body.glb') != '' }}
        run: godot --headless --path . --script res://tests/test_campaign_character_asset_resolution.gd
      - name: Test MakeHuman target parser
        run: |
          python -m py_compile tools/makehuman/target_format.py
          python -m unittest discover -s tests -p test_makehuman_target_format.py
      - name: Run distant light perception tests
        run: godot --headless --path . --script res://tests/test_distant_light_perception.gd
      - name: Run hex-grid tests
        run: godot --headless --path . --script res://tests/test_hex_grid.gd
      - name: Run split character and progression tests
        run: bash tools/ci/run_godot_checked.sh godot --headless --path . --script res://tests/test_character_systems.gd
      - name: Run spell construction and cost rules tests
