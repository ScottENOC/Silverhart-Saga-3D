name: Wren standalone bra attachment visual review

on:
  push:
    branches: [feature/full-body-overlapping-anatomy-vocabulary]
    paths:
      - ".github/workflows/wren-bra-attachment-review.yml"
      - "tools/review/wren_bra_attachment_review.gd"
      - "scripts/presentation/ara_character_actor.gd"
  pull_request:
    branches: [feature/ara-garment-fit-guides]
    paths:
      - ".github/workflows/wren-bra-attachment-review.yml"
      - "tools/review/wren_bra_attachment_review.gd"
      - "scripts/presentation/ara_character_actor.gd"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    # The initial MakeHuman asset download is about 280 MB. Allow it to finish
    # once; the vendor cache below makes subsequent runs substantially faster.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download latest successful native Wren build from dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$run_id" != "null"
          run_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.run_number')
          gh run download "$run_id" --name "wren-native-ara-$run_number" --dir build/wren-download
          cp build/wren-download/Wren.glb build/wren-native/Wren.glb
          test -s build/wren-native/Wren.glb
          echo "WREN_BUILD_RUN=$run_id" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.head_sha' > build/wren-native/source-sha.txt

      - name: Install Blender and asset build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri unzip

      - name: Generate the standalone Ara bra asset
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/olatunde85/3d-gen.git /tmp/ara-3d-gen
          git -C /tmp/ara-3d-gen checkout b60b5bece6d383d2cbb7067fd50e7c8e68b5a395
          cd /tmp/ara-3d-gen
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Restore or cache MakeHuman generator assets
        uses: actions/cache@v4
        with:
          path: /tmp/ara-3d-gen/vendor
          # Bump v1 if the pinned generator or its asset layout changes.
          key: makehuman-vendor-ubuntu-3d-gen-b60b5bece6d383d2cbb7067fd50e7c8e68b5a395-v1

      - name: Set up MakeHuman assets
        working-directory: /tmp/ara-3d-gen
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#https://files.makehumancommunity.org/asset_packs/#https://files2.makehumancommunity.org/asset_packs/#' scripts/setup-assets.ts
          setup_ok=false
          for attempt in 1 2 3; do
            if npm run setup-assets; then setup_ok=true; break; fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          test "$setup_ok" = true

      - name: Export and fit standalone Ara bra asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = {
            "seed":218,"gender":0,"age":0.5,"muscle":0.5,"weight":0.5,
            "height":0.5,"proportions":0.5,"african":0.05,"asian":0.05,
            "caucasian":0.9,"breastSize":0.5,"breastFirmness":0.55,
            "hair":"short02","hairTint":"#49372a","outfit":"none","top":"none",
            "underTop":"bra","underBottom":"none","jacket":"none","bottom":"none",
            "underwear":False,"shoes":"none","hat":"none","weapon":"none",
            "carry":"none","accessories":[],"detail":"high","rig":"game",
            "restPose":"A","animations":True,"faceBones":True,"faceShapes":True,
            "speechShapes":False,"expression":"neutral","name":"Wren bra attachment review"
          }
          json.dump(p, open("/tmp/wren-bra.params.json","w"), indent=2)
          PY
          mkdir -p /tmp/wren-bra-export
          cd /tmp/ara-3d-gen
          npm run export -- --params /tmp/wren-bra.params.json --detail high --formats glb --out /tmp/wren-bra-export
          # Current exporter writes a GLB directly; older versions may emit a ZIP.
          direct_glb=$(find /tmp/wren-bra-export -maxdepth 1 -name '*.glb' -print -quit)
          if [ -n "$direct_glb" ]; then
            cp "$direct_glb" /tmp/wren-bra-source.glb
          else
            zip_file=$(find /tmp/wren-bra-export -maxdepth 1 -name '*.zip' -print -quit)
            test -n "$zip_file"
            entry=$(unzip -Z1 "$zip_file" | grep -E '\.glb$' | head -n 1)
            test -n "$entry"
            unzip -p "$zip_file" "$entry" > /tmp/wren-bra-source.glb
          fi
          test -s /tmp/wren-bra-source.glb
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/wren-bra-build
          blender --background --python-exit-code 1 --python tools/blender/add_adult_anatomy.py -- --input art/characters/ara_runtime/ara_person_body.glb --output /tmp/wren-bra-body.glb --profile female --adult
          python tools/ara/extract_garment_glb.py --body /tmp/wren-bra-body.glb --source /tmp/wren-bra-source.glb --selector "Bra" --output /tmp/wren-bra-assembled.glb
          blender --background --python-exit-code 1 --python tools/blender/add_adult_anatomy.py -- --input /tmp/wren-bra-assembled.glb --output /tmp/wren-bra-fitted.glb --profile none --adult --fit-existing
          python tools/ara/extract_garment_glb.py --strip-input /tmp/wren-bra-fitted.glb --keep-material "Bra" --output art/characters/ara_runtime/garments/female_bra.glb
          test -s art/characters/ara_runtime/garments/female_bra.glb

      - name: Install Godot and render actual Wren attachment
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and render front side rear
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          godot --headless --editor --path . --quit
          xvfb-run -a -s "-screen 0 1280x1200x24" godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tools/review/wren_bra_attachment_review.gd
          for view in front side rear; do test -s "build/wren-bra-attachment-review/$view.png"; done
          cp build/wren-native/source-sha.txt build/wren-bra-attachment-review/
          printf '{"wren_build_run":%s,"garment_source":"pinned Ara 3d-gen bra export","review_source_sha":"%s"}\n' "$WREN_BUILD_RUN" "${GITHUB_SHA}" > build/wren-bra-attachment-review/provenance.json

      - uses: actions/upload-artifact@v7
        with:
          name: wren-bra-attachment-review
          path: build/wren-bra-attachment-review/
          if-no-files-found: error
          retention-days: 30
