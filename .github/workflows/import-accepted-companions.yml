name: Import approved native companion models

on:
  push:
    branches: [dev, feature/character-runtime-asset-integration, feature/unified-female-anatomy-v2]
    paths:
      - ".github/workflows/import-accepted-companions.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: import-approved-companion-models
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Download Dagna build #131 with integrated anatomy v2
        uses: actions/download-artifact@v8
        with:
          name: dagna-native-ara-131
          repository: ${{ github.repository }}
          run-id: 45550892688
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/accepted-dagna

      - name: Install the exact accepted GLBs and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p art/characters/companions
          test -s /tmp/accepted-dagna/Dagna.glb
          # Wren Talbot and Ser Aldric Thorne are now sourced from the canonical
          # campaign cast models. Remove their superseded duplicate companion exports.
          find art/characters/companions -maxdepth 1 -type f \( -name 'wren*' -o -name 'aldric*' \) -delete
          cp /tmp/accepted-dagna/Dagna.glb art/characters/companions/dagna.glb
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("art/characters/companions")
          sources = {
              "dagna.glb": {"character": "Dagna Stoneward", "workflow_run": 45550892688, "build": 131, "accepted_source_commit": "768adfcf1db2ded39329e00215c874347d3892f6"},
          }
          manifest = {"schema_version": 1, "assets": {}}
          for filename, provenance in sources.items():
              payload = (root / filename).read_bytes()
              if len(payload) < 1_000_000:
                  raise SystemExit(f"Unexpectedly small companion GLB: {filename}")
              manifest["assets"][filename] = {
                  **provenance,
                  "size_bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Install Godot 4.7.2 and validate the regenerated companion GLBs
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Generate Godot import metadata for companion assets
        run: godot --headless --editor --path . --quit

      - name: Commit approved companion assets to the integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/characters/companions/
          if git diff --cached --quiet; then
            echo "Companion assets are already current."
            exit 0
          fi
          git commit -m "Keep Dagna companion asset; resolve Wren and Aldric from canonical cast"
          git stash push --include-untracked -m "temporary Godot import side effects"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
