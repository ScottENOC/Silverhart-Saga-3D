name: iPhone preview — Hollowmere Ara build

on:
  push:
    branches: [dev, feature/iphone-hollowmere-ara-preview]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: iphone-hollowmere-ara-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Import Ara cast and export Godot Web for GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Hollowmere game build
        uses: actions/checkout@v4

      - name: Locate latest successful Ara character build
        id: ara
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow hollowmere-npcs.yml --branch feature/opening-village --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using Ara character build run $run_id"

      - name: Download the generated 13-character Ara pack
        uses: actions/download-artifact@v4
        with:
          name: hollowmere-npc-models
          run-id: ${{ steps.ara.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/hollowmere-npc-models

      - name: Install Ara models into the Godot project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p art/characters/hollowmere
          cp /tmp/hollowmere-npc-models/*.glb art/characters/hollowmere/
          cp /tmp/hollowmere-npc-models/*.params.json art/characters/hollowmere/
          cp /tmp/hollowmere-npc-models/profiles.json art/characters/hollowmere/
          count="$(find art/characters/hollowmere -maxdepth 1 -name '*.glb' | wc -l)"
          test "$count" -eq 13
          test -s art/characters/hollowmere/profiles.json
          echo "Installed $count Ara character models"

      - name: Install Godot 4.7.2 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project and Ara GLBs
        run: godot --headless --editor --path . --quit

      - name: Run hex-grid tests
        run: godot --headless --path . --script res://tests/test_hex_grid.gd

      - name: Run simulation tests
        run: godot --headless --path . --script res://tests/test_simulation.gd

      - name: Run character appearance tests
        run: godot --headless --path . --script res://tests/test_character_appearance.gd

      - name: Run Hollowmere map and Ara profile tests
        run: godot --headless --path . --script res://tests/test_hollowmere_village.gd

      - name: Launch opening village scene
        run: godot --headless --path . --quit-after 10

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
          find build/web -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .
          find build/web -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .

      - name: Record Hollowmere web build revision
        run: printf '%s\\n' "${GITHUB_SHA}" > build/web/build-version.txt

      - name: Save Hollowmere browser build for combined GitHub Pages deployment
        uses: actions/upload-artifact@v4
        with:
          name: hollowmere-ara-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: Trigger combined GitHub Pages deployment
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run godot-web-export.yml --ref dev
          echo "Triggered a fresh combined Pages deployment after the Hollowmere artifact was saved."
