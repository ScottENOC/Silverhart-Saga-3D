name: Wren and Aldric contact path visual review

on:
  push:
    branches: [feature/ara-garment-fit-guides]
    paths:
      - ".github/workflows/ara-contact-path-visual-review.yml"
      - "tools/review/ara_contact_path_review.gd"
      - "scripts/characters/character_surface_contact_path.gd"
      - "scripts/characters/character_surface_regions.gd"
      - "scripts/characters/character_surface_region_mask.gd"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Download latest successful native Wren and Aldric builds from dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/wren-native build/aldric-native
          wren_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-wren-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          aldric_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-aldric-native-ara.yml/runs?branch=dev&status=success&per_page=1" --jq '.workflow_runs[0].id')
          test "$wren_run" != "null" && test "$aldric_run" != "null"
          wren_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$wren_run" --jq '.run_number')
          aldric_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$aldric_run" --jq '.run_number')
          gh run download "$wren_run" --name "wren-native-ara-$wren_number" --dir build/wren-download
          gh run download "$aldric_run" --name "aldric-native-ara-$aldric_number" --dir build/aldric-download
          cp build/wren-download/Wren.glb build/wren-native/Wren.glb
          cp build/aldric-download/Aldric.glb build/aldric-native/Aldric.glb
          test -s build/wren-native/Wren.glb
          test -s build/aldric-native/Aldric.glb
          echo "WREN_RUN=$wren_run" >> "$GITHUB_ENV"
          echo "ALDRIC_RUN=$aldric_run" >> "$GITHUB_ENV"
      - name: Install Godot 4.7.2 and import companion models
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import actual Wren and Aldric builds
        run: |
          godot --version
          godot --headless --editor --path . --quit
      - name: Render synthetic surface-following traces on Wren and Aldric
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1400x1300x24" godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tools/review/ara_contact_path_review.gd
          for character in wren aldric; do
            for view in front side rear; do
              test -s "build/ara-contact-path-review/$character/$view.png"
            done
            test -s "build/ara-contact-path-review/$character/report.json"
          done
          printf '{"wren_run":%s,"aldric_run":%s}\n' "$WREN_RUN" "$ALDRIC_RUN" > build/ara-contact-path-review/source-runs.json
      - uses: actions/upload-artifact@v7
        with:
          name: wren-aldric-contact-path-visual-review
          path: build/ara-contact-path-review/
          if-no-files-found: error
          retention-days: 30
