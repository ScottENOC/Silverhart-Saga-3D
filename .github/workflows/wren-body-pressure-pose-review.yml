name: Wren body pressure pose review

on:
  push:
    branches: [feature/wren-single-character-pressure-pose]
    paths:
      - "tools/review/wren_body_pressure_pose_blender.py"
      - ".github/workflows/wren-body-pressure-pose-review.yml"
      - "character-preview/wren-ara.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wren-body-pressure-pose-review
  cancel-in-progress: true

jobs:
  wren-contact-review:
    name: Pose Wren and inspect body pressure targets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build native Ara Wren
        run: |
          mkdir -p build/wren-native
          # character_details is game-side metadata, not part of Ara's export schema.
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("character-preview/wren-ara.json","utf8")); delete p.character_details; fs.writeFileSync("build/wren-native/wren-export.json", JSON.stringify(p,null,2));'
          npx --yes ara3d@latest export --params build/wren-native/wren-export.json --detail high --no-animations --formats glb,zip --out build/wren-native
          # Ara already writes the requested character as Wren.glb.
          test -s build/wren-native/Wren.glb
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil xvfb libegl1 libgl1-mesa-dri
      - name: Validate and render Wren-only contact pose
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          python -m py_compile tools/review/wren_body_pressure_pose_blender.py
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-exit-code 1 --python tools/review/wren_body_pressure_pose_blender.py
          test -s build/wren-body-pressure-pose/wren-body-pressure-preview.png
          test -s build/wren-body-pressure-pose/wren-body-pressure-pose.glb
          test -s build/wren-body-pressure-pose/wren-body-pressure-report.json
          test -s build/wren-body-pressure-pose/wren-body-pressure-compressed-preview.png
          test -s build/wren-body-pressure-pose/wren-buttock-stiffness-sweep.glb
          test -s build/wren-body-pressure-pose/wren-stiffness-sweep-preview.png
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("build/wren-body-pressure-pose/wren-body-pressure-report.json").read_text())
          assert report["validation"]["wren_only"]
          assert report["validation"]["both_arm_ik_created"], report["ik"]
          assert report["validation"]["preview_rendered"]
          assert report["validation"]["posed_glb_exported"]
          assert report["validation"]["pressure_shapes_authored"], report.get("authored_pressure_shapes", [])
          assert any(shape["region_id"] == "buttock_right" and shape["affected_vertices"] > 0 for shape in report["authored_pressure_shapes"]), report.get("authored_pressure_shapes", [])
          assert report["validation"]["pressure_compressed_preview_rendered"], report.get("pressure_preview", {})
          assert report["validation"]["stiffness_sweep_glb_exported"], report.get("stiffness_sweep", {})
          assert report["validation"]["stiffness_sweep_preview_rendered"], report.get("stiffness_sweep", {})
          assert len(report["stiffness_sweep"]["cases"]) == 4
          assert report["contact_target_surface_anchors"]["target_clearance_m"] == 0.0
          assert report["validation"]["palm_anchor_within_5mm_of_selected_surface"], report["palm_anchor_surface_gaps"]
          assert all(report["contact_target_surface_anchors"][side] for side in ("left_breast","right_hip"))
          assert all(report["palm_target_errors"].get(side) is not None for side in ("left","right"))
          print("Wren-only pose and localized pressure-shape package passed structural checks.")
          print("Pressure shapes found:", report["deformation_status"]["pressure_shapes_found"])
          print("Stiffness sweep GLB:", report["stiffness_sweep"])
          print("Palm-anchor-to-selected-surface gaps (m):", json.dumps(report.get("palm_anchor_surface_gaps", {})))
          print("This verifies a bone-based palm proxy, not final hand-mesh collision or anatomical-region membership.")
          print("Selected surface anchors:", json.dumps(report["contact_target_surface_anchors"]))
          print("Pressure shape authoring is a mesh-level prototype; Godot runtime binding is a separate integration check.")
          print(json.dumps(report,indent=2))
          PY
      - name: Upload Wren-only preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wren-body-pressure-pose
          path: build/wren-body-pressure-pose/
          if-no-files-found: warn
          retention-days: 30
