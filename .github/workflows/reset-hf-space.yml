name: Reset Hugging Face Wren Workshop
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/reset-hf-space.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  reset-space:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Hugging Face Hub client
        run: python -m pip install --disable-pip-version-check --quiet huggingface_hub
      - name: Delete and recreate the private static Space
        env:
          HF_TOKEN: ${{ secrets.HF_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_ADMIN_TOKEN is missing"; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, HfHubHTTPError

          repo_id = "Thisisausername836/wren-workshop"
          api = HfApi(token=os.environ["HF_TOKEN"])

          # The prior attempt may already have deleted the Space.
          try:
              before = api.repo_info(repo_id, repo_type="space")
          except Exception as exc:
              from huggingface_hub.errors import RepositoryNotFoundError
              if not isinstance(exc, RepositoryNotFoundError):
                  raise
              before = None

          if before is not None:
              if before.id != repo_id or before.private is not True:
                  raise RuntimeError(f"Refusing to reset unexpected Space: {before.id}, private={before.private}")
              print(f"Verified target: {before.id} (private={before.private})")
              print("Deleting the old Space and its retained repository history...")
              api.delete_repo(repo_id=repo_id, repo_type="space")
              print("Old Space deleted.")
          else:
              print("Old Space is already deleted; proceeding with recreation.")

          print("Recreating the same Space as private static hosting...")
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              private=True,
              space_sdk="static",
          )
          after = api.repo_info(repo_id, repo_type="space")
          if after.id != repo_id or after.private is not True:
              raise RuntimeError(f"Recreated Space verification failed: {after.id}, private={after.private}")
          print({
              "recreated": after.id,
              "private": after.private,
              "sha": after.sha,
              "files": [item.rfilename for item in (after.siblings or [])],
          })
          PY
      - name: Trigger a fresh Ara build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ScottENOC/Silverhart-Saga-3D/actions/workflows/wren-workshop.yml/dispatches \
            -d '{"ref":"dev"}'
          echo "Fresh Ara build dispatched."
