name: Set up cached character build tools
description: Install and cache the Ara data and Blender toolchain used by native character builds.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20

    - name: Cache Ara character data
      uses: actions/cache@v4
      with:
        path: .cache/ara3d
        key: ara3d-data-${{ runner.os }}-cli-0.7.4-v1

    - name: Cache Ara CLI npm package
      uses: actions/cache@v4
      with:
        path: ~/.npm/_npx
        key: ara3d-cli-${{ runner.os }}-0.7.4-v1

    - name: Cache downloaded Ubuntu packages and package lists
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: character-apt-${{ runner.os }}-blender-xvfb-v2
        restore-keys: |
          character-apt-${{ runner.os }}-blender-xvfb-

    - name: Install Blender and preview dependencies (retry transient mirror failures)
      shell: bash
      run: |
        set -euo pipefail
        apt_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true)
        for attempt in 1 2 3; do
          if sudo apt-get "${apt_opts[@]}" update; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::apt-get update failed after 3 attempts"
            exit 1
          fi
          echo "apt-get update failed; retrying in 20 seconds (attempt $attempt/3)"
          sleep 20
        done
        for attempt in 1 2 3; do
          if sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends \
            blender python3-numpy python3-pil libegl1 libgl1-mesa-dri xvfb; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::apt-get install failed after 3 attempts"
            exit 1
          fi
          echo "apt-get install failed; retrying in 20 seconds (attempt $attempt/3)"
          sleep 20
        done
